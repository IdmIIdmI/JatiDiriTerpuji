
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102b35">
<title>JATIDIRI TERPUJI</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#102b35;font-family:Arial,sans-serif;
 touch-action:none
}
#game{position:relative;width:100%;height:100%;overflow:hidden}
canvas{width:100%;height:100%;display:block}

#top{
 position:absolute;top:8px;left:8px;right:8px;
 display:flex;justify-content:space-between;gap:5px;
 pointer-events:none
}
.panel{
 background:linear-gradient(135deg,#102b35ed,#1d5262e8);
 color:white;border:1px solid #ffffff55;
 border-radius:14px;padding:9px 11px;
 font-size:12px;font-weight:bold;
 box-shadow:0 4px 15px #0003;
 backdrop-filter:blur(8px)
}
#missionText{max-width:58%;text-align:center}

#buttons{
 position:absolute;bottom:12px;left:10px;right:10px;
 display:flex;justify-content:space-between;
 align-items:end;pointer-events:none
}
#stick{
 width:112px;height:112px;border-radius:50%;
 background:#153d4b66;border:2px solid #ffffff99;
 position:relative;pointer-events:auto;
 touch-action:none;backdrop-filter:blur(8px);
 box-shadow:0 5px 20px #0004
}
#knob{
 position:absolute;width:48px;height:48px;
 left:29px;top:29px;border-radius:50%;
 background:linear-gradient(145deg,#fff,#b9e7ed);
 border:3px solid #398a9a;
 box-shadow:0 3px 9px #0005
}
#actionButtons{
 display:grid;grid-template-columns:repeat(2,68px);
 gap:7px;pointer-events:auto
}
.ctrl{
 height:48px;border:1px solid #ffffff99;
 border-radius:15px;
 background:linear-gradient(145deg,#24677aee,#123b50ee);
 color:white;font-weight:bold;font-size:10px;
 touch-action:none;backdrop-filter:blur(8px);
 box-shadow:0 4px 12px #0004
}
.ctrl:active{
 background:#55a9b4;transform:scale(.94)
}
#sound,#admin{
 position:absolute;right:9px;bottom:170px;
 border:1px solid #ffffff66;border-radius:20px;
 padding:9px 13px;background:#123e50cc;
 color:white;font-weight:bold
}
#admin{bottom:210px}

#overlay{
 position:absolute;inset:0;background:#071b24e8;
 display:flex;align-items:center;justify-content:center;
 padding:12px;z-index:10
}
#box{
 width:min(520px,95vw);max-height:92%;overflow:auto;
 background:linear-gradient(145deg,#fff,#d9f5ef);
 border:2px solid #e7bd55;border-radius:24px;
 padding:18px;text-align:center;color:#12343c;
 box-shadow:0 15px 50px #0006
}
h1{font-size:clamp(22px,5vw,34px);margin:5px 0;color:#14566a}
input{
 width:90%;padding:12px;margin:5px;
 border:1px solid #91b9b5;border-radius:10px;font-size:16px
}
.mainbtn{
 background:linear-gradient(135deg,#079b82,#086a70);
 color:white;border:0;border-radius:14px;
 padding:12px 22px;font-weight:bold;font-size:15px;margin:5px
}
.smallbtn{
 background:#e9b84e;color:#263b40;border:0;
 border-radius:10px;padding:9px 13px;font-weight:bold;margin:4px
}
#toast{
 position:absolute;top:62px;left:50%;
 transform:translateX(-50%);
 background:#102b35ef;color:white;border-radius:14px;
 padding:10px 16px;font-weight:bold;font-size:13px;
 display:none;max-width:85%;text-align:center;z-index:15;
 box-shadow:0 5px 18px #0004
}
.account{
 display:flex;justify-content:space-between;
 align-items:center;padding:7px;background:#e8f4ed;
 margin:5px;border-radius:8px
}
.mission-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:7px;margin:12px 0
}
.mission-choice{
 border:1px solid #9dbbb5;border-radius:10px;
 padding:10px 5px;background:#fff;color:#183b42;
 font-weight:bold;font-size:12px
}
.mission-choice:disabled{opacity:.35;background:#cbd6d2}
.mission-choice.done{background:#d9f2d7;border-color:#5b9b62}
.treasure-grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:6px;text-align:left;margin:10px 0
}
.treasure-item{
 background:#e8f2e9;border-radius:8px;
 padding:8px;font-size:12px
}
@media(orientation:portrait){
 #box:after{
  content:"Pusingkan telefon ke mod melintang untuk pengalaman terbaik.";
  display:block;color:#a04424;font-weight:bold;margin-top:10px
 }
}
</style>
</head>

<body>
<div id="game">
<canvas id="c"></canvas>

<div id="top">
 <div class="panel" id="score">💎 MATA: 0</div>
 <div class="panel" id="missionText">JATIDIRI TERPUJI</div>
 <div class="panel" id="progress">0 / 5</div>
</div>

<div id="toast"></div>
<button id="sound">♫ BUNYI ON</button>
<button id="admin" style="display:none">PANEL GURU</button>

<div id="buttons">
 <div id="stick"><div id="knob"></div></div>
 <div id="actionButtons">
  <button class="ctrl" id="fire">TEMBAK</button>
  <button class="ctrl" id="fireUp">TEMBAK ATAS</button>
  <button class="ctrl" id="jump">LOMPAT</button>
  <button class="ctrl" id="duck">TUNDUK</button>
  <button class="ctrl" id="act">ANGKAT / AKSI</button>
 </div>
</div>

<div id="overlay">
 <div id="box">
  <h1>JATIDIRI TERPUJI</h1>
  <b>KP2027 – Pengembaraan 20 Misi Karakter</b>
  <p>Login untuk memulakan pengembaraan.</p>
  <input id="loginId" placeholder="ID pengguna">
  <input id="loginPw" type="password" placeholder="Kata laluan">
  <button class="mainbtn" id="login">LOGIN</button>
  <p style="font-size:11px">Login guru pertama: guru / guru123</p>
 </div>
</div>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('c'),ctx=canvas.getContext('2d');

let W,H,playing=false,muted=false,joystick=0,camera=0;
let user=null,world=[],enemies=[],shots=[],particles=[];
let mission=0,collected=0,last=0,walk=0;
let audio=null,toastTimer=null,carriedBox=null;
let fireCooldown=0,musicTimer=null,musicStep=0;

/* KELAJUAN BAHARU */
const MOVE_SPEED=3.35;
const GRAVITY=.55;
const WORLD_WIDTH=8500;
const saveKey='JT2027_DATA';

function resize(){
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=innerWidth*d;
 canvas.height=innerHeight*d;
 ctx.setTransform(d,0,0,d,0,0);
 W=innerWidth;H=innerHeight;
}
addEventListener('resize',resize);
resize();

const missions=[
 ['Kutip Botol Plastik','Cari botol plastik dan masukkan ke tong kitar semula.','botol'],
 ['Kitar Semula Tin','Cari tin aluminium dan masukkan ke tong.','tin'],
 ['Selamatkan Arnab','Pecahkan peti dan selamatkan anak arnab.','arnab'],
 ['Berkongsi Rezeki','Cari makanan dan bantu penduduk.','makanan'],
 ['Hadiah Buat Sahabat','Cari hadiah untuk orang yang bersedih.','hadiah'],
 ['Beri Makan Kucing','Cari makanan dan berikan kepada kucing.','ikan'],
 ['Tabung Masjid','Kutip wang syiling dan masukkan ke tabung.','syiling'],
 ['Pesanan Kebaikan','Cari belon pesanan dan serahkan kepada penduduk.','belon'],
 ['Misi Buah Mangga','Cari mangga masak dan berikan kepada penduduk.','mangga'],
 ['Buka Laluan','Alihkan halangan kayu yang menghalang jalan.','kayu'],
 ['Mendamaikan Sahabat','Cari bunga dan bantu sahabat berbaik semula.','bunga'],
 ['Bantu Warga Emas','Cari barang dan bantu warga emas.','bakul'],
 ['Cari Orang Sesat','Temui penduduk yang sesat dan bimbing mereka.','petunjuk'],
 ['Misi Banjir','Kumpulkan pelampung dan bantu penduduk.','pelampung'],
 ['Selamatkan Anak Burung','Cari anak burung dan bawa ke sarang.','burung'],
 ['Pembantu Kebakaran','Ambil baldi dan bantu memadamkan api kecil.','baldi'],
 ['Bina Jambatan','Kumpulkan papan untuk membina jambatan.','papan'],
 ['Pulangkan Barang','Cari beg yang hilang dan pulangkan.','beg'],
 ['Bantuan Pergunungan','Kumpulkan makanan dan selimut.','selimut'],
 ['Cabaran Kemuncak','Selesaikan cabaran dan bantu penduduk.','bekalan']
];

const locations=[
'KAMPUNG HIJAU','PANTAI BIRU','HUTAN BULUH','LEMBAH MANGGA',
'TAMAN BUNGA','SUNGAI JERNIH','KAWASAN MASJID','TAMAN IMPIAN',
'KEBUN BUAH','LALUAN KAYU','TAMAN SAHABAT','KAMPUNG DAMAI',
'HUTAN RIMBA','KAWASAN BANJIR','HUTAN BURUNG','KAMPUNG API',
'JAMBATAN SUNGAI','PEKAN LAMA','KAWASAN GUNUNG','DUNIA JATIDIRI'
];

const treasures=[
'Duit Perak','Duit Emas','Cincin Perak','Cincin Emas',
'Gelang Perak','Gelang Emas','Rantai Perak','Rantai Emas',
'Permata Delima','Permata Nilam','Zamrud','Mutiara',
'Mahkota Perak','Mahkota Emas','Keris Perak','Keris Emas',
'Piala Perak','Piala Emas','Peti Khazanah','Harta Karun Diraja'
];

let data;
try{
 data=JSON.parse(localStorage.getItem(saveKey)||'null');
}catch(e){data=null}

if(!data){
 data={
  accounts:[{id:'guru',pw:'guru123',role:'guru',name:'Guru'}],
  scores:{},progress:{},treasures:{}
 };
}
data.accounts=data.accounts||[];
data.scores=data.scores||{};
data.progress=data.progress||{};
data.treasures=data.treasures||{};
if(!data.accounts.some(a=>a.role==='guru')){
 data.accounts.unshift({id:'guru',pw:'guru123',role:'guru',name:'Guru'});
}
saveData();

function saveData(){
 localStorage.setItem(saveKey,JSON.stringify(data));
}
function key(){return user.id}
function getScore(){return data.scores[key()]||0}
function setScore(v){
 data.scores[key()]=Math.max(0,v);
 saveData();updateHUD();
}
function getProgress(){
 return data.progress[key()]||{mission:0,done:{}};
}
function setProgress(p){
 data.progress[key()]=p;saveData();
}
function getTreasures(){
 if(!data.treasures[key()])data.treasures[key()]={};
 return data.treasures[key()];
}
function treasureTotal(){
 return Object.values(getTreasures()).reduce((a,b)=>a+(Number(b)||0),0);
}
function addTreasure(name){
 let t=getTreasures();
 t[name]=(t[name]||0)+1;
 saveData();
 toast('Harta Karun diperoleh: '+name);
 updateHUD();
}
function toast(t){
 $('toast').textContent=t;
 $('toast').style.display='block';
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$('toast').style.display='none',2200);
}

/* AUDIO */
function getAudio(){
 try{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  return audio;
 }catch(e){return null}
}
function tone(freq=440,dur=.1,type='sine',vol=.08){
 if(muted)return;
 try{
  let ac=getAudio();if(!ac)return;
  let o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(g);g.connect(ac.destination);
  o.start();o.stop(ac.currentTime+dur);
 }catch(e){}
}
function musicNote(freq,duration=.28,volume=.045){
 if(muted)return;
 try{
  let ac=getAudio();if(!ac)return;
  let o=ac.createOscillator(),g=ac.createGain();
  o.type='triangle';o.frequency.value=freq;
  g.gain.setValueAtTime(.001,ac.currentTime);
  g.gain.linearRampToValueAtTime(volume,ac.currentTime+.035);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);
  o.connect(g);g.connect(ac.destination);
  o.start();o.stop(ac.currentTime+duration+.02);
 }catch(e){}
}
function startMusic(){
 if(muted)return;
 stopMusic();
 const melody=[523,659,784,659,587,698,880,698,523,659,784,1047,880,784,659,587];
 const bass=[131,131,165,165,147,147,175,175];
 musicStep=0;
 musicTimer=setInterval(()=>{
  if(!playing||muted)return;
  musicNote(melody[musicStep%melody.length],.34,.075);
  if(musicStep%2===0)
   musicNote(bass[Math.floor(musicStep/2)%bass.length],.42,.055);
  musicStep++;
 },300);
}
function stopMusic(){
 if(musicTimer){clearInterval(musicTimer);musicTimer=null}
}
function sfx(n){
 const sounds={
  jump:()=>tone(400,.12,'triangle'),
  shoot:()=>tone(170,.08,'sawtooth'),
  pickup:()=>{tone(650,.1);setTimeout(()=>tone(850,.1),70)},
  hurt:()=>tone(100,.25,'sawtooth'),
  smash:()=>tone(130,.2,'square'),
  stomp:()=>tone(260,.14,'triangle'),
  win:()=>[523,659,784,1046].forEach((n,i)=>setTimeout(()=>tone(n,.25),i*130))
 };
 if(sounds[n])sounds[n]();
}
$('sound').onclick=()=>{
 muted=!muted;
 $('sound').textContent=muted?'♫ BUNYI OFF':'♫ BUNYI ON';
 if(muted){
  stopMusic();
  if('speechSynthesis'in window)speechSynthesis.cancel();
 }else if(playing){
  getAudio();startMusic();
 }
};

/* LOGIN */
$('login').onclick=()=>{
 let id=$('loginId').value.trim(),pw=$('loginPw').value;
 let account=data.accounts.find(a=>a.id===id&&a.pw===pw);
 if(!account){toast('ID atau kata laluan salah!');return}
 user=account;
 $('admin').style.display=user.role==='guru'?'block':'none';
 mission=getProgress().mission||0;
 showMissionSelect();
};
$('admin').onclick=showAdmin;

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

/* PANEL GURU */
function showAdmin(){
 playing=false;stopMusic();
 $('overlay').style.display='flex';
 let html='<h1>PANEL GURU</h1><p>Cipta atau buang akaun murid.</p>';
 html+='<input id="newId" placeholder="ID murid">';
 html+='<input id="newPw" placeholder="Kata laluan murid">';
 html+='<input id="newName" placeholder="Nama murid">';
 html+='<button class="mainbtn" id="addAccount">TAMBAH AKAUN</button><div>';
 data.accounts.forEach(a=>{
  if(a.role!=='guru'){
   html+='<div class="account"><span>'+escapeHTML(a.id)+' – '+escapeHTML(a.name)+'</span><button class="smallbtn" data-del="'+escapeHTML(a.id)+'">BUANG</button></div>';
  }
 });
 html+='</div><button class="mainbtn" id="backGame">KEMBALI KE MISI</button>';
 $('box').innerHTML=html;
 $('addAccount').onclick=()=>{
  let id=$('newId').value.trim(),pw=$('newPw').value;
  let name=$('newName').value.trim();
  if(!id||!pw){toast('Isi ID dan kata laluan.');return}
  if(data.accounts.some(a=>a.id===id)){toast('ID sudah digunakan.');return}
  data.accounts.push({id,pw,role:'murid',name:name||id});
  saveData();showAdmin();toast('Akaun murid berjaya ditambah.');
 };
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
  let id=b.dataset.del;
  data.accounts=data.accounts.filter(a=>a.id!==id);
  delete data.scores[id];delete data.progress[id];delete data.treasures[id];
  saveData();showAdmin();toast('Akaun dibuang.');
 });
 $('backGame').onclick=showMissionSelect;
}

function showTreasureCollection(){
 let t=getTreasures();
 let html='<h1>HARTA KARUN</h1><p>Jumlah koleksi: <b>'+treasureTotal()+'</b></p><div class="treasure-grid">';
 treasures.forEach((n,i)=>{
  html+='<div class="treasure-item">'+(i+1)+'. '+n+'<br><b>Dimiliki: '+(t[n]||0)+'</b></div>';
 });
 html+='</div><button class="mainbtn" id="closeTreasure">KEMBALI</button>';
 $('box').innerHTML=html;
 $('closeTreasure').onclick=showMissionSelect;
}

function showMissionSelect(){
 playing=false;stopMusic();
 $('overlay').style.display='flex';
 let p=getProgress();
 let current=Math.max(0,Math.min(19,p.mission||0));
 let html='<h1>PILIH MISI</h1>';
 html+='<p>💎 Mata terkumpul: <b>'+getScore()+'</b></p>';
 html+='<p>Harta Karun: <b>'+treasureTotal()+'</b></p>';
 html+='<button class="smallbtn" id="openTreasure">KOLEKSI HARTA KARUN</button>';
 html+='<p>Misi yang selesai boleh dimainkan semula.</p><div class="mission-grid">';
 missions.forEach((m,i)=>{
  let unlocked=i<=current||!!p.done[i],done=!!p.done[i];
  html+='<button class="mission-choice '+(done?'done':'')+'" data-mission="'+i+'" '+(!unlocked?'disabled':'')+'>';
  html+=(done?'✓ ':'')+(i+1)+'. '+escapeHTML(m[0])+'</button>';
 });
 html+='</div><button class="mainbtn" id="continueMission">SAMBUNG MISI SETERUSNYA</button>';
 $('box').innerHTML=html;
 document.querySelectorAll('[data-mission]').forEach(b=>{
  b.onclick=()=>{mission=Number(b.dataset.mission);startGame()};
 });
 $('continueMission').onclick=()=>{mission=current;startGame()};
 $('openTreasure').onclick=showTreasureCollection;
}

/* WATAK */
const player={
 x:100,y:0,vx:0,vy:0,w:38,h:66,
 dir:1,jumps:0,duck:false,inv:0,onGround:true
};
const ground=()=>H-90;

function addCrate(x){
 world.push({
  type:'crate',x,y:ground()-48,w:48,h:48,
  broken:false,carried:false,thrown:false,vx:0,vy:0
 });
}
function enemyCount(){
 if(mission<4)return 5;
 if(mission<9)return 10;
 if(mission<14)return 15;
 if(mission<19)return 20;
 return 25;
}
function makeWorld(){
 world=[];enemies=[];shots=[];particles=[];
 collected=0;camera=0;walk=0;
 carriedBox=null;fireCooldown=0;
 player.x=100;player.y=ground()-player.h;
 player.vx=0;player.vy=0;player.jumps=0;
 player.duck=false;player.inv=0;player.onGround=true;

 for(let i=0;i<5;i++){
  world.push({
   type:'item',kind:missions[mission][2],
   x:650+i*1250+Math.random()*150,
   y:ground()-45,w:35,h:35,got:false
  });
  world.push({
   type:'npc',x:1000+i*1250,
   y:ground()-60,w:40,h:60,helped:false
  });
 }
 for(let i=0;i<25;i++)addCrate(380+i*315);
 for(let i=0;i<15;i++){
  world.push({
   type:'obstacle',x:520+i*540,
   y:ground()-48,w:65+Math.random()*28,
   h:48,broken:false
  });
 }

 let types=['bird'];
 if(mission>=2)types.push('bat');
 if(mission>=5)types.push('turtle');
 if(mission>=7)types.push('fox');
 if(mission>=10)types.push('hedgehog');
 if(mission>=13)types.push('dragon');

 for(let i=0;i<enemyCount();i++){
  let type=types[i%types.length];
  let x=550+i*(WORLD_WIDTH-1000)/Math.max(1,enemyCount()-1)+Math.random()*100;
  let flying=['bird','bat','dragon'].includes(type);
  enemies.push({
   type,x,
   y:flying?ground()-(type==='dragon'?210:150+Math.random()*100):
    ground()-(type==='turtle'?38:42),
   w:type==='dragon'?76:type==='turtle'?55:52,
   h:type==='dragon'?54:type==='turtle'?38:40,
   vx:(i%2?1:-1)*(1.4+Math.random()*1.2),
   phase:Math.random()*6,alive:true,
   hp:type==='dragon'?3:1,attack:Math.random()*100
  });
 }
 updateHUD();
}
function updateHUD(){
 if(!user)return;
 $('score').textContent='💎 MATA: '+getScore();
 $('missionText').textContent='MISI '+(mission+1)+': '+missions[mission][0];
 $('progress').textContent=collected+' / 5';
}
function startGame(){
 $('overlay').style.display='none';
 makeWorld();playing=true;
 say('Misi nombor '+(mission+1)+'. '+missions[mission][0]+'. '+missions[mission][1]);
 if(!muted){getAudio();startMusic()}
}
function say(t){
 if(!muted&&'speechSynthesis'in window){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t);
  u.lang='ms-MY';u.rate=.95;speechSynthesis.speak(u);
 }
}
function jump(){
 if(!playing||player.jumps>=2)return;
 player.vy=player.jumps===0?-12:-14;
 player.jumps++;player.onGround=false;sfx('jump');
}
function duck(v){if(playing)player.duck=v}
function shoot(up=false){
 if(!playing||fireCooldown>0)return;
 shots.push({
  x:player.x+player.w/2,
  y:up?player.y+8:player.y+25,
  vx:up?0:player.dir*10,
  vy:up?-11:0,life:55
 });
 fireCooldown=9;sfx('shoot');
}
function action(){
 if(!playing)return;
 if(carriedBox){
  let b=carriedBox;
  b.carried=false;b.thrown=true;
  b.vx=player.dir*13;b.vy=-7.5;
  b.x=player.x+(player.dir>0?player.w:-b.w);
  b.y=player.y+18;
  carriedBox=null;toast('Peti dilontarkan!');sfx('smash');return;
 }
 let crate=world.find(o=>o.type==='crate'&&!o.broken&&!o.carried&&
  Math.abs(o.x-player.x)<75&&Math.abs(o.y-player.y)<90);
 if(crate){
  crate.carried=true;carriedBox=crate;
  toast('Peti diangkat! Tekan AKSI untuk melontar.');return;
 }
 let item=world.find(o=>o.type==='item'&&!o.got&&Math.abs(o.x-player.x)<90);
 if(item){
  item.got=true;collected++;setScore(getScore()+100);
  sfx('pickup');toast('Barang misi diperoleh! +100 mata');
  updateHUD();if(collected>=5)setTimeout(completeMission,500);return;
 }
 let npc=world.find(o=>o.type==='npc'&&!o.helped&&Math.abs(o.x-player.x)<90);
 if(npc){
  npc.helped=true;collected++;setScore(getScore()+100);
  toast('Penduduk dibantu! +100 mata');
  updateHUD();if(collected>=5)setTimeout(completeMission,500);return;
 }
 toast('Dekati peti, barang atau penduduk untuk berinteraksi.');
}
function reward(){
 if(mission<5)return 5;
 if(mission<10)return 8;
 if(mission<15)return 10;
 return 15;
}
function completeMission(){
 if(!playing)return;
 playing=false;stopMusic();
 let p=getProgress();
 p.done[mission]=true;
 if(mission<19)p.mission=Math.max(p.mission||0,mission+1);
 else p.mission=19;
 setProgress(p);
 let bonus=reward();
 setScore(getScore()+bonus+500);sfx('win');
 showMessage('MISI SELESAI!',
  missions[mission][1]+'<br><br>Ganjaran: 500 mata + '+bonus+' mata.',
  'PILIH MISI',()=>showMissionSelect());
}
function showMessage(title,desc,btn,fn){
 $('overlay').style.display='flex';
 $('box').innerHTML='<h1>'+title+'</h1><p>'+desc+'</p><button class="mainbtn" id="next">'+btn+'</button>';
 $('next').onclick=()=>{$('overlay').style.display='none';fn()};
}

/* MUSUH */
function damagePlayer(amount,message){
 if(player.inv>0)return;
 player.inv=90;setScore(getScore()-amount);
 player.vy=-5;player.vx=-player.dir*2;sfx('hurt');
 if(navigator.vibrate){
  try{navigator.vibrate([180,70,180])}catch(e){}
 }
 toast(message+' -'+amount+' mata');
}
function enemyDamage(e){
 if(e.type==='dragon'||e.type==='hedgehog')return 5;
 return 3;
}
function enemyName(e){
 return {
  bird:'Burung hitam',bat:'Kelawar',dragon:'Naga',
  hedgehog:'Landak',turtle:'Kura-kura',fox:'Musang'
 }[e.type]||'Musuh';
}
function defeatEnemy(e){
 if(!e.alive)return;
 e.alive=false;sfx('stomp');
 toast(enemyName(e)+' ditewaskan!');
}
function breakCrate(b){
 if(b.broken)return;
 b.broken=true;b.carried=false;
 if(carriedBox===b)carriedBox=null;
 sfx('smash');
 addTreasure(treasures[Math.floor(Math.random()*treasures.length)]);
 for(let i=0;i<9;i++){
  particles.push({
   x:b.x+b.w/2,y:b.y+b.h/2,
   vx:(Math.random()-.5)*5,
   vy:-Math.random()*5-1,life:35,
   color:i%2?'#e9b84e':'#fff1a3'
  });
 }
}

/* KEMAS KINI */
function update(dt){
 if(!playing)return;
 if(fireCooldown>0)fireCooldown-=dt;
 player.h=player.duck?38:66;
 player.vx=joystick*MOVE_SPEED;
 if(joystick)player.dir=joystick>0?1:-1;
 player.x=Math.max(0,Math.min(WORLD_WIDTH-player.w,player.x+player.vx*dt));
 player.vy+=GRAVITY*dt;
 player.y+=player.vy*dt;

 if(player.y>=ground()-player.h){
  player.y=ground()-player.h;player.vy=0;
  player.jumps=0;player.onGround=true;
 }else player.onGround=false;
 if(player.inv>0)player.inv-=dt;

 for(let o of world){
  if(o.type==='obstacle'&&!o.broken&&
   player.x+player.w>o.x&&player.x<o.x+o.w&&
   player.y+player.h>o.y){
   if(player.y+player.h<o.y+20&&player.vy>=0){
    player.y=o.y-player.h;player.vy=0;
    player.jumps=0;player.onGround=true;
   }else player.x-=player.dir*3;
  }
 }
 if(carriedBox){
  carriedBox.x=player.x+player.dir*30;
  carriedBox.y=player.y-25;
 }

 for(let b of world){
  if(b.type!=='crate'||b.broken||b.carried||!b.thrown)continue;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=.35*dt;
  if(b.y+b.h>=ground()){breakCrate(b);continue}
  for(let e of enemies){
   if(e.alive&&Math.abs(b.x-e.x)<e.w&&Math.abs(b.y-e.y)<e.h){
    defeatEnemy(e);breakCrate(b);break;
   }
  }
  if(b.x<0||b.x>WORLD_WIDTH)breakCrate(b);
 }

 for(let e of enemies){
  if(!e.alive)continue;
  e.phase+=.13*dt;e.attack+=dt;
  if(['bird','bat','dragon'].includes(e.type)){
   e.x+=e.vx*dt;
   e.y+=Math.sin(e.phase*(e.type==='bat'?1.7:1))*1.5*dt;
   if(e.x<100||e.x>WORLD_WIDTH-100)e.vx*=-1;
  }else{
   e.x+=e.vx*dt;
   if(e.x<100||e.x>WORLD_WIDTH-100)e.vx*=-1;
   if(e.type==='fox'&&Math.abs(e.x-player.x)<260)
    e.x+=Math.sign(player.x-e.x)*2.2*dt;
   if(e.type==='turtle')e.x+=Math.sin(e.phase)*.5*dt;
  }
  let overlap=player.x+player.w>e.x&&player.x<e.x+e.w&&
   player.y+player.h>e.y&&player.y<e.y+e.h;
  if(overlap){
   let above=player.vy>0&&player.y+player.h-e.y<22;
   if(above&&e.type!=='hedgehog'){
    defeatEnemy(e);player.y=e.y-player.h;
    player.vy=-8;player.jumps=1;
   }else damagePlayer(enemyDamage(e),enemyName(e)+' melanggar watak!');
  }
 }

 for(let s of shots){
  s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  for(let e of enemies){
   if(!e.alive)continue;
   if(Math.abs(s.x-(e.x+e.w/2))<e.w/2+7&&
      Math.abs(s.y-(e.y+e.h/2))<e.h/2+7){
    e.hp--;s.life=0;
    if(e.hp<=0)defeatEnemy(e);
    else toast('Musuh terkena! Serang lagi.');
    break;
   }
  }
  for(let b of world){
   if(b.type==='crate'&&!b.broken&&!b.carried&&
    Math.abs(s.x-(b.x+b.w/2))<b.w/2&&
    Math.abs(s.y-(b.y+b.h/2))<b.h/2){
    s.life=0;breakCrate(b);break;
   }
  }
 }
 shots=shots.filter(s=>s.life>0);

 for(let p of particles){
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.2*dt;p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);

 if(Math.abs(player.vx)>.1&&player.onGround&&!player.duck)walk+=dt*.24;

 /* KAMERA LEBIH LICIN */
 let target=Math.max(0,Math.min(WORLD_WIDTH-W,player.x+player.w/2-W/2));
 camera+=(target-camera)*Math.min(1,.14*dt);
}

/* FUNGSI LUKISAN */
function rounded(x,y,w,h,r,color){
 ctx.fillStyle=color;
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function ellipse(x,y,rx,ry,color){
 ctx.fillStyle=color;
 ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();
}

/* LUKIS WATAK MODEN */
function drawHero(){
 let x=player.x-camera,y=player.y;
 if(player.inv>0&&Math.floor(player.inv/5)%2===0)return;
 let moving=Math.abs(player.vx)>.08&&player.onGround&&!player.duck;
 let swing=moving?Math.sin(walk)*9:0;
 let arm=moving?Math.sin(walk+Math.PI)*7:0;

 ctx.save();
 if(player.dir<0){
  ctx.translate(x+player.w,0);ctx.scale(-1,1);
 }else ctx.translate(x,0);

 ellipse(19,y+player.h,20,5,'#173b5044');

 if(player.duck){
  rounded(3,y+15,33,25,11,'#14758a');
  ellipse(19,y+13,12,12,'#d9a17b');
 }else{
  /* KAKI */
  ctx.strokeStyle='#d9a17b';ctx.lineWidth=8;
  ctx.lineCap='round';
  ctx.beginPath();
  if(player.onGround){
   ctx.moveTo(12,y+52);ctx.lineTo(12+swing,y+63);
   ctx.moveTo(26,y+52);ctx.lineTo(26-swing,y+63);
  }else{
   ctx.moveTo(12,y+52);ctx.lineTo(6,y+61);
   ctx.moveTo(26,y+52);ctx.lineTo(33,y+61);
  }
  ctx.stroke();

  rounded(3+swing,y+61,15,7,4,'#18394e');
  rounded(20-swing,y+61,15,7,4,'#18394e');

  /* BAJU DENGAN GRADIENT */
  let shirt=ctx.createLinearGradient(0,y+22,0,y+58);
  shirt.addColorStop(0,'#38a6b0');
  shirt.addColorStop(1,'#145b79');
  rounded(5,y+24,28,34,9,shirt);

  /* LENGAN */
  ctx.strokeStyle='#d9a17b';ctx.lineWidth=7;
  ctx.beginPath();
  if(!player.onGround){
   ctx.moveTo(6,y+31);ctx.lineTo(-1,y+24);
   ctx.moveTo(32,y+31);ctx.lineTo(39,y+24);
  }else{
   ctx.moveTo(6,y+31);ctx.lineTo(3+arm,y+44);
   ctx.moveTo(32,y+31);ctx.lineTo(35-arm,y+44);
  }
  ctx.stroke();

  /* LEHER DAN WAJAH */
  rounded(14,y+21,10,9,4,'#bd8968');
  ellipse(19,y+15,15,15,'#d9a17b');

  /* KOPIAH */
  ellipse(19,y+3,19,7,'#f2eee2');
  rounded(7,y-3,24,9,5,'#173e50');

  /* MATA DAN SENYUM */
  ellipse(13,y+13,1.7,2,'#25313a');
  ellipse(24,y+13,1.7,2,'#25313a');

  ctx.strokeStyle='#8b503b';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(19,y+18,4,.15,Math.PI-.15);ctx.stroke();

  /* BUTANG BAJU */
  ellipse(19,y+34,1.5,1.5,'#f3d98d');
  ellipse(19,y+43,1.5,1.5,'#f3d98d');
 }
 ctx.restore();
}

/* LUKIS MUSUH */
function drawEnemy(e){
 let x=e.x-camera,y=e.y;
 ctx.save();
 ctx.translate(x+e.w/2,y+e.h/2);
 let flap=Math.sin(e.phase*2)*5;

 if(e.type==='bird'){
  ellipse(0,0,23,13,'#17212d');
  ctx.fillStyle='#35495a';
  ctx.beginPath();
  ctx.moveTo(-5,0);ctx.quadraticCurveTo(-25,-28-flap,-17,7);
  ctx.lineTo(0,5);ctx.fill();
  ctx.beginPath();
  ctx.moveTo(5,0);ctx.quadraticCurveTo(25,-28+flap,17,7);
  ctx.lineTo(0,5);ctx.fill();
  ctx.fillStyle='#e4b848';
  ctx.beginPath();ctx.moveTo(17,-2);ctx.lineTo(32,3);ctx.lineTo(17,7);ctx.fill();
  ellipse(11,-5,4,4,'#fff');
  ellipse(12,-5,2,2,'#111');
 }
 else if(e.type==='bat'){
  ellipse(0,0,20,12,'#38294f');
  ctx.fillStyle='#58466e';
  ctx.beginPath();ctx.moveTo(-5,0);ctx.quadraticCurveTo(-30,-30-flap,-20,10);ctx.fill();
  ctx.beginPath();ctx.moveTo(5,0);ctx.quadraticCurveTo(30,-30+flap,20,10);ctx.fill();
  ellipse(12,-5,2,2,'#ffd75c');
 }
 else if(e.type==='dragon'){
  ellipse(0,3,31,19,'#328b54');
  ctx.fillStyle='#23683c';
  ctx.beginPath();ctx.moveTo(-10,-5);ctx.quadraticCurveTo(-35,-35-flap,2,-10);ctx.fill();
  ctx.beginPath();ctx.moveTo(8,-5);ctx.quadraticCurveTo(35,-35+flap,1,-10);ctx.fill();
  ellipse(18,-7,4,4,'#f4cf64');
  ctx.fillStyle='#f3d16b';
  ctx.beginPath();ctx.moveTo(28,4);ctx.lineTo(43,9);ctx.lineTo(28,13);ctx.fill();
  ellipse(-35,5,8,4,'#24683d');
 }
 else if(e.type==='hedgehog'){
  ellipse(0,5,25,16,'#9b6943');
  ctx.strokeStyle='#493324';ctx.lineWidth=4;
  for(let i=-3;i<=3;i++){
   ctx.beginPath();ctx.moveTo(i*6,-4);
   ctx.lineTo(i*8-2,-23-Math.abs(i));ctx.stroke();
  }
  ellipse(17,2,10,10,'#d5a77a');
  ellipse(20,-1,2,2,'#111');
 }
 else if(e.type==='turtle'){
  ellipse(0,8,25,13,'#76b65a');
  ellipse(0,-3,24,16,'#367447');
  ellipse(0,-5,16,10,'#72a95c');
  ctx.strokeStyle='#b4c77b';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,-3,15,Math.PI,Math.PI*2);ctx.stroke();
  ellipse(22,5,10,10,'#76b65a');
  ellipse(25,2,2,2,'#111');
 }
 else if(e.type==='fox'){
  ellipse(0,2,25,15,'#df8037');
  ctx.fillStyle='#c9672e';
  ctx.beginPath();ctx.moveTo(-17,-5);ctx.lineTo(-26,-25);ctx.lineTo(-5,-12);ctx.fill();
  ctx.beginPath();ctx.moveTo(8,-8);ctx.lineTo(22,-25);ctx.lineTo(21,-2);ctx.fill();
  ellipse(24,3,12,9,'#fff0d8');
  ellipse(20,-4,2.5,2.5,'#171717');
  ctx.fillStyle='#b95a27';
  ctx.beginPath();ctx.moveTo(-20,3);ctx.quadraticCurveTo(-44,-15,-38,8);ctx.quadraticCurveTo(-31,23,-17,10);ctx.fill();
 }
 ctx.restore();
}

/* LATAR NATURAL DAN BERLAPIS */
function drawCloud(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 ellipse(0,0,27,13,'#ffffffd9');
 ellipse(-17,3,18,10,'#ffffffd9');
 ellipse(15,4,20,10,'#ffffffd9');
 ellipse(-5,-9,16,14,'#ffffffeb');
 ellipse(12,-7,15,12,'#ffffffeb');
 ctx.restore();
}
function drawTree(x,y,s=1){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 /* BATANG */
 ctx.fillStyle='#795238';
 ctx.beginPath();
 ctx.moveTo(-7,0);ctx.quadraticCurveTo(-4,-30,-5,-54);
 ctx.lineTo(7,-54);ctx.quadraticCurveTo(5,-25,8,0);ctx.fill();

 /* DAUN BERTINDIH */
 ellipse(0,-60,27,28,'#287b4c');
 ellipse(-17,-47,18,23,'#3c9957');
 ellipse(17,-47,19,24,'#398e50');
 ellipse(-7,-76,19,20,'#53a961');
 ellipse(12,-69,17,19,'#61b36a');

}
function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#53bde0');
 g.addColorStop(.55,'#b6e9dd');
 g.addColorStop(1,'#eff5ce');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 /* CAHAYA MATAHARI */
 let sun=ctx.createRadialGradient(W*.82,H*.18,5,W*.82,H*.18,85);
 sun.addColorStop(0,'#fff9d4');
 sun.addColorStop(.35,'#fff4bd99');
 sun.addColorStop(1,'#fff4bd00');
 ctx.fillStyle=sun;ctx.fillRect(W*.82-90,H*.18-90,180,180);
 ellipse(W*.82,H*.18,29,29,'#fff1b5');

 /* AWAN */
 drawCloud(W*.16-camera*.06,H*.17,.9);
 drawCloud(W*.52-camera*.08,H*.11,.7);
 drawCloud(W*.9-camera*.05,H*.28,.8);

 /* BUKIT JAUH */
 ctx.fillStyle='#91cba0';
 ctx.beginPath();
 ctx.moveTo(0,ground());
 for(let x=0;x<=W;x+=5){
  ctx.lineTo(x,ground()-125-Math.sin((x+camera*.12)/130)*38);
 }
 ctx.lineTo(W,ground());ctx.fill();

 /* BUKIT DEKAT */
 ctx.fillStyle='#65ad72';
 ctx.beginPath();
 ctx.moveTo(0,ground());
 for(let x=0;x<=W;x+=5){
  ctx.lineTo(x,ground()-70-Math.sin((x+camera*.23)/95)*28);
 }
 ctx.lineTo(W,ground());ctx.fill();

 /* POKOK DI LATAR */
 for(let i=0;i<9;i++){
  let x=((i*180-camera*.38)%(W+200)+W+200)%(W+200)-80;
  drawTree(x,ground()-70,.6);
 }

 /* TANAH */
 let earth=ctx.createLinearGradient(0,ground(),0,H);
 earth.addColorStop(0,'#4b9b54');
 earth.addColorStop(.15,'#327e48');
 earth.addColorStop(1,'#20583d');
 ctx.fillStyle=earth;
 ctx.fillRect(0,ground(),W,H-ground());

 ctx.fillStyle='#a7d777';
 ctx.fillRect(0,ground(),W,5);

 /* RUMPUT KECIL */
 ctx.strokeStyle='#b2dc7d';
 ctx.lineWidth=2;
 for(let i=0;i<70;i++){
  let x=((i*67-camera*.8)%(W+30)+W+30)%(W+30);
  let y=ground()+8+(i%4)*8;
  ctx.beginPath();ctx.moveTo(x,y+6);ctx.lineTo(x-3,y);ctx.stroke();
 }

 ctx.fillStyle='#fff';
 ctx.font='bold 15px Arial';
 ctx.textAlign='center';
 ctx.shadowColor='#174c40';
 ctx.shadowBlur=5;
 ctx.fillText(locations[mission],W/2,H*.22);
 ctx.shadowBlur=0;
}

/* PAPARAN OBJEK */

 drawBackground();

 for(let o of world){
  let x=o.x-camera;
  if(x<-120||x>W+120)continue;

  if(o.type==='obstacle'&&!o.broken){
   rounded(x,o.y,o.w,o.h,12,'#9a7049');
   rounded(x+4,o.y+4,o.w-8,8,4,'#c69b6b');
   ctx.strokeStyle='#71482c';ctx.lineWidth=3;
   ctx.beginPath();ctx.moveTo(x+8,o.y+10);
   ctx.lineTo(x+o.w-8,o.y+o.h-10);ctx.stroke();
  }

  if(o.type==='crate'&&!o.broken){
   rounded(x,o.y,o.w,o.h,7,'#a66b35');
   rounded(x+4,o.y+4,o.w-8,o.h-8,5,'#c38a4f');
   ctx.strokeStyle='#81502a';ctx.lineWidth=4;
   ctx.beginPath();
   ctx.moveTo(x+5,o.y+5);ctx.lineTo(x+o.w-5,o.y+o.h-5);
   ctx.moveTo(x+o.w-5,o.y+5);ctx.lineTo(x+5,o.y+o.h-5);
   ctx.stroke();
   if(o.carried){
    ctx.fillStyle='#fff';ctx.font='bold 10px Arial';
    ctx.textAlign='center';ctx.fillText('PETI',x+o.w/2,o.y-5);
   }
  }

  if(o.type==='item'&&!o.got){
   drawMissionItem(o,x);
  }

  if(o.type==='npc'&&!o.helped){
   rounded(x+7,o.y+17,27,37,9,'#257b88');
   ellipse(x+20,o.y+10,12,12,'#d9a17b');
   ellipse(x+16,o.y+8,1.5,1.5,'#222');
   ellipse(x+23,o.y+8,1.5,1.5,'#222');
   ellipse(x+20,o.y+19,5,2,'#fff');
   ctx.fillStyle='#ffe77a';
   ctx.font='bold 16px Arial';ctx.textAlign='center';
   ctx.fillText('!',x+20,o.y-5);
  }
 }

 for(let e of enemies)if(e.alive)drawEnemy(e);

 for(let s of shots){
  ctx.fillStyle='#ffe56b';ctx.shadowColor='#fff5a8';ctx.shadowBlur=10;
  ellipse(s.x-camera,s.y,5,5,'#ffe56b');
  ctx.shadowBlur=0;
 }

 for(let p of particles){
  ctx.globalAlpha=Math.max(0,p.life/35);
  ellipse(p.x-camera,p.y,4,4,p.color);
 }
 ctx.globalAlpha=1;
 drawHero();
}

/* GELUNG PERMAINAN */
function loop(t){
 let dt=Math.min(2,(t-last)/16.67||1);
 last=t;
 update(dt);render();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* KAWALAN TELEFON */
const stick=$('stick'),knob=$('knob');
function moveStick(e){
 let r=stick.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;
 let len=Math.hypot(dx,dy),max=34;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 joystick=Math.abs(dx)<6?0:dx/max;
}
stick.onpointerdown=e=>{
 stick.setPointerCapture(e.pointerId);moveStick(e);
};
stick.onpointermove=e=>{
 if(e.buttons)moveStick(e);
};
function resetStick(){
 joystick=0;knob.style.transform='translate(0,0)';
}
stick.onpointerup=resetStick;
stick.onpointercancel=resetStick;

function hold(id,down,up){
 let b=$(id);
 b.onpointerdown=e=>{
  e.preventDefault();b.setPointerCapture(e.pointerId);down();
 };
 b.onpointerup=e=>{e.preventDefault();up()};
 b.onpointercancel=up;
 b.onlostpointercapture=up;
}
hold('jump',jump,()=>{});
hold('duck',()=>duck(true),()=>duck(false));
hold('fire',()=>shoot(false),()=>{});
hold('fireUp',()=>shoot(true),()=>{});

$('act').onpointerdown=e=>{
 e.preventDefault();action();
};

/* PAPAN KEKUNCI */
addEventListener('keydown',e=>{
 if(e.repeat)return;
 if(e.key==='ArrowRight'||e.key==='d')joystick=1;
 if(e.key==='ArrowLeft'||e.key==='a')joystick=-1;
 if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();
 if(e.key==='s'||e.key==='ArrowDown')duck(true);
 if(e.key==='j')shoot(false);
 if(e.key==='i')shoot(true);
 if(e.key==='k'||e.key==='Enter')action();
});
addEventListener('keyup',e=>{
 if(['ArrowRight','d','ArrowLeft','a'].includes(e.key))joystick=0;
 if(e.key==='s'||e.key==='ArrowDown')duck(false);
});

/* SAMBUNG KEMAJUAN */
mission=Math.max(0,Math.min(19,getProgress().mission||0));

})();
</script>
</body>
</html>
