<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102b35">
<title>JATIDIRI TERPUJI</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#102b35;font-family:Arial,sans-serif;
 touch-action:none
}
#game{position:relative;width:100%;height:100%;overflow:hidden}
canvas{width:100%;height:100%;display:block}

#top{
 position:absolute;top:8px;left:8px;right:8px;
 display:flex;justify-content:space-between;gap:5px;
 pointer-events:none
}
.panel{
 background:#102b35dd;color:white;
 border:1px solid #ffffff66;border-radius:12px;
 padding:8px;font-size:12px;font-weight:bold;
 box-shadow:0 2px 8px #0005
}
#missionText{max-width:58%;text-align:center}

#buttons{
 position:absolute;bottom:12px;left:10px;right:10px;
 display:flex;justify-content:space-between;
 align-items:end;pointer-events:none
}
#stick{
 width:112px;height:112px;border-radius:50%;
 background:#153d4b35;border:3px solid #ffffff88;
 position:relative;pointer-events:auto;
 touch-action:none;backdrop-filter:blur(5px);
 box-shadow:0 3px 12px #0003
}
#knob{
 position:absolute;width:48px;height:48px;
 left:29px;top:29px;border-radius:50%;
 background:#ffffffbb;border:3px solid #287f91;
 box-shadow:0 2px 7px #0005
}
#actionButtons{
 display:grid;grid-template-columns:repeat(2,68px);
 gap:6px;pointer-events:auto
}
.ctrl{
 height:48px;border:2px solid #ffffff88;
 border-radius:14px;background:#123e5055;
 color:white;font-weight:bold;font-size:10px;
 touch-action:none;backdrop-filter:blur(5px);
 box-shadow:0 3px 9px #0003
}
.ctrl:active{background:#ffffff66;transform:scale(.96)}

#sound,#admin{
 position:absolute;right:9px;bottom:170px;
 border:1px solid #ffffff66;border-radius:20px;
 padding:8px 12px;background:#123e5077;
 color:white;font-weight:bold
}
#admin{bottom:210px}

#overlay{
 position:absolute;inset:0;background:#071b24e8;
 display:flex;align-items:center;justify-content:center;
 padding:12px;z-index:10
}
#box{
 width:min(520px,95vw);max-height:92%;overflow:auto;
 background:linear-gradient(145deg,#fff,#d9f5ef);
 border:3px solid #e7bd55;border-radius:22px;
 padding:18px;text-align:center;color:#12343c
}
h1{font-size:clamp(22px,5vw,34px);margin:5px 0;color:#14566a}
input{
 width:90%;padding:12px;margin:5px;
 border:1px solid #91b9b5;border-radius:10px;font-size:16px
}
.mainbtn{
 background:#087e72;color:white;border:0;
 border-radius:14px;padding:12px 22px;
 font-weight:bold;font-size:15px;margin:5px
}
.smallbtn{
 background:#e9b84e;color:#263b40;border:0;
 border-radius:10px;padding:9px 13px;font-weight:bold;margin:4px
}
#toast{
 position:absolute;top:62px;left:50%;
 transform:translateX(-50%);
 background:#102b35ef;color:white;border-radius:14px;
 padding:9px 15px;font-weight:bold;font-size:13px;
 display:none;max-width:85%;text-align:center;z-index:15
}
.account{
 display:flex;justify-content:space-between;
 align-items:center;padding:7px;background:#e8f4ed;
 margin:5px;border-radius:8px
}
.mission-grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:7px;margin:12px 0
}
.mission-choice{
 border:1px solid #9dbbb5;border-radius:10px;
 padding:10px 5px;background:#fff;color:#183b42;
 font-weight:bold;font-size:12px
}
.mission-choice:disabled{opacity:.35;background:#cbd6d2}
.mission-choice.done{background:#d9f2d7;border-color:#5b9b62}
.treasure-grid{
 display:grid;grid-template-columns:repeat(2,1fr);
 gap:6px;text-align:left;margin:10px 0
}
.treasure-item{background:#e8f2e9;border-radius:8px;padding:8px;font-size:12px}

@media(orientation:portrait){
 #box:after{
  content:"Pusingkan telefon ke mod melintang untuk pengalaman terbaik.";
  display:block;color:#a04424;font-weight:bold;margin-top:10px
 }
}
</style>
</head>

<body>
<div id="game">
<canvas id="c"></canvas>

<div id="top">
 <div class="panel" id="score">💎 MATA: 0</div>
 <div class="panel" id="missionText">JATIDIRI TERPUJI</div>
 <div class="panel" id="progress">0 / 5</div>
</div>

<div id="toast"></div>
<button id="sound">♫ BUNYI ON</button>
<button id="admin" style="display:none">PANEL GURU</button>

<div id="buttons">
 <div id="stick"><div id="knob"></div></div>
 <div id="actionButtons">
  <button class="ctrl" id="fire">TEMBAK</button>
  <button class="ctrl" id="fireUp">TEMBAK ATAS</button>
  <button class="ctrl" id="jump">LOMPAT</button>
  <button class="ctrl" id="duck">TUNDUK</button>
  <button class="ctrl" id="act">ANGKAT / AKSI</button>
 </div>
</div>

<div id="overlay">
 <div id="box">
  <h1>JATIDIRI TERPUJI</h1>
  <b>KP2027 – Pengembaraan 20 Misi Karakter</b>
  <p>Login untuk memulakan pengembaraan.</p>
  <input id="loginId" placeholder="ID pengguna">
  <input id="loginPw" type="password" placeholder="Kata laluan">
  <button class="mainbtn" id="login">LOGIN</button>
  <p style="font-size:11px">Login guru pertama: guru / guru123</p>
 </div>
</div>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('c'),ctx=canvas.getContext('2d');

let W,H,playing=false,muted=false,joystick=0,camera=0;
let user=null,world=[],enemies=[],shots=[],particles=[];
let mission=0,collected=0,last=0,walk=0;
let audio=null,toastTimer=null,carriedBox=null;
let fireCooldown=0;

/* SISTEM MUZIK LATAR */
let musicTimer=null;
let musicStep=0;
let musicGain=null;

const MOVE_SPEED=2.90;
const saveKey='JT2027_DATA';

function resize(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 ctx.imageSmoothingEnabled=true;
 W=innerWidth;H=innerHeight;
}
addEventListener('resize',resize);
resize();

const missions=[
 ['Kutip Botol Plastik','Cari botol plastik dan masukkan ke tong kitar semula.','botol'],
 ['Kitar Semula Tin','Cari tin aluminium dan masukkan ke tong.','tin'],
 ['Selamatkan Arnab','Pecahkan peti dan selamatkan anak arnab.','arnab'],
 ['Berkongsi Rezeki','Cari makanan dan bantu penduduk.','makanan'],
 ['Hadiah Buat Sahabat','Cari hadiah untuk orang yang bersedih.','hadiah'],
 ['Beri Makan Kucing','Cari makanan dan berikan kepada kucing.','ikan'],
 ['Tabung Masjid','Kutip wang syiling dan masukkan ke tabung.','syiling'],
 ['Pesanan Kebaikan','Cari belon pesanan dan serahkan kepada penduduk.','belon'],
 ['Misi Buah Mangga','Cari mangga masak dan berikan kepada penduduk.','mangga'],
 ['Buka Laluan','Alihkan halangan kayu yang menghalang jalan.','kayu'],
 ['Mendamaikan Sahabat','Cari bunga dan bantu sahabat berbaik semula.','bunga'],
 ['Bantu Warga Emas','Cari barang dan bantu warga emas.','bakul'],
 ['Cari Orang Sesat','Temui penduduk yang sesat dan bimbing mereka.','petunjuk'],
 ['Misi Banjir','Kumpulkan pelampung dan bantu penduduk.','pelampung'],
 ['Selamatkan Anak Burung','Cari anak burung dan bawa ke sarang.','burung'],
 ['Pembantu Kebakaran','Ambil baldi dan bantu memadamkan api kecil.','baldi'],
 ['Bina Jambatan','Kumpulkan papan untuk membina jambatan.','papan'],
 ['Pulangkan Barang','Cari beg yang hilang dan pulangkan.','beg'],
 ['Bantuan Pergunungan','Kumpulkan makanan dan selimut.','selimut'],
 ['Cabaran Kemuncak','Selesaikan cabaran dan bantu penduduk.','bekalan']
];

const locations=[
'KAMPUNG HIJAU','PANTAI BIRU','HUTAN BULUH','LEMBAH MANGGA',
'TAMAN BUNGA','SUNGAI JERNIH','KAWASAN MASJID','TAMAN IMPIAN',
'KEBUN BUAH','LALUAN KAYU','TAMAN SAHABAT','KAMPUNG DAMAI',
'HUTAN RIMBA','KAWASAN BANJIR','HUTAN BURUNG','KAMPUNG API',
'JAMBATAN SUNGAI','PEKAN LAMA','KAWASAN GUNUNG','DUNIA JATIDIRI'
];

/* SENARAI HARTA KARUN ASAL - JANGAN DIUBAH */
const treasures=[
'Duit Perak','Duit Emas','Cincin Perak','Cincin Emas',
'Gelang Perak','Gelang Emas','Rantai Perak','Rantai Emas',
'Permata Delima','Permata Nilam','Zamrud','Mutiara',
'Mahkota Perak','Mahkota Emas','Keris Perak','Keris Emas',
'Piala Perak','Piala Emas','Peti Khazanah','Harta Karun Diraja'
];

let data=JSON.parse(localStorage.getItem(saveKey)||'null');

if(!data){
 data={
  accounts:[{id:'guru',pw:'guru123',role:'guru',name:'Guru'}],
  scores:{},progress:{},treasures:{}
 };
 localStorage.setItem(saveKey,JSON.stringify(data));
}
if(!data.accounts)data.accounts=[];
if(!data.scores)data.scores={};
if(!data.progress)data.progress={};
if(!data.treasures)data.treasures={};

function saveData(){localStorage.setItem(saveKey,JSON.stringify(data))}
function key(){return user.id}
function getScore(){return data.scores[key()]||0}

function setScore(v){
 data.scores[key()]=Math.max(0,v);
 saveData();updateHUD();
}
function getProgress(){
 return data.progress[key()]||{mission:0,done:{}};
}
function setProgress(p){
 data.progress[key()]=p;saveData();
}
function getTreasures(){
 if(!data.treasures[key()])data.treasures[key()]={};
 return data.treasures[key()];
}
function treasureTotal(){
 return Object.values(getTreasures()).reduce((a,b)=>a+(Number(b)||0),0);
}
function addTreasure(name){
 let t=getTreasures();
 t[name]=(t[name]||0)+1;
 saveData();
 toast('Harta Karun diperoleh: '+name);
 updateHUD();
}
function toast(t){
 $('toast').textContent=t;
 $('toast').style.display='block';
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$('toast').style.display='none',2200);
}

/* AUDIO */
function getAudio(){
 try{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  return audio;
 }catch(e){
  return null;
 }
}

function tone(freq=440,dur=.1,type='sine',vol=.08){
 if(muted)return;
 try{
  let ac=getAudio();
  if(!ac)return;

  let o=ac.createOscillator(),g=ac.createGain();
  o.type=type;
  o.frequency.value=freq;
  g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(g);g.connect(ac.destination);
  o.start();o.stop(ac.currentTime+dur);
 }catch(e){}
}

/* MUZIK LATAR BERMELODI */
function musicNote(freq,duration=.28,volume=.045){
 if(muted)return;

 try{
  let ac=getAudio();
  if(!ac)return;

  let osc=ac.createOscillator();
  let gain=ac.createGain();

  osc.type='triangle';
  osc.frequency.setValueAtTime(freq,ac.currentTime);

  gain.gain.setValueAtTime(.001,ac.currentTime);
  gain.gain.linearRampToValueAtTime(volume,ac.currentTime+.035);
  gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);

  osc.connect(gain);
  gain.connect(ac.destination);

  osc.start();
  osc.stop(ac.currentTime+duration+.02);
 }catch(e){}
}

function startMusic(){
 if(muted)return;

 stopMusic();

 let melody=[
  523.25,659.25,783.99,659.25,
  587.33,698.46,880,698.46,
  523.25,659.25,783.99,1046.50,
  880,783.99,659.25,587.33
 ];

 let bass=[
  130.81,130.81,164.81,164.81,
  146.83,146.83,174.61,174.61
 ];

 musicStep=0;

 musicTimer=setInterval(()=>{
  if(!playing||muted)return;

  let note=melody[musicStep%melody.length];
  musicNote(note,.34,.075);

  if(musicStep%2===0){
   let low=bass[Math.floor(musicStep/2)%bass.length];
   musicNote(low,.42,.055);
  }

  musicStep++;
 },300);
}

function stopMusic(){
 if(musicTimer){
  clearInterval(musicTimer);
  musicTimer=null;
 }
}

function sfx(n){
 const sounds={
  jump:()=>tone(400,.12,'triangle'),
  shoot:()=>tone(170,.08,'sawtooth'),
  pickup:()=>{tone(650,.1);setTimeout(()=>tone(850,.1),70)},
  hurt:()=>tone(100,.25,'sawtooth'),
  smash:()=>tone(130,.2,'square'),
  stomp:()=>tone(260,.14,'triangle'),
  win:()=>[523,659,784,1046].forEach((n,i)=>setTimeout(()=>tone(n,.25),i*130))
 };
 if(sounds[n])sounds[n]();
}

$('sound').onclick=()=>{
 muted=!muted;
 $('sound').textContent=muted?'♫ BUNYI OFF':'♫ BUNYI ON';

 if(muted){
  stopMusic();
  if('speechSynthesis'in window)speechSynthesis.cancel();
 }else if(playing){
  getAudio();
  startMusic();
 }
};

$('login').onclick=()=>{
 let id=$('loginId').value.trim(),pw=$('loginPw').value;
 let account=data.accounts.find(a=>a.id===id&&a.pw===pw);
 if(!account){toast('ID atau kata laluan salah!');return}
 user=account;
 $('admin').style.display=user.role==='guru'?'block':'none';
 mission=getProgress().mission||0;
 showMissionSelect();
};
$('admin').onclick=showAdmin;

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
 }[c]));
}

/* PANEL GURU */
function showAdmin(){
 playing=false;
 stopMusic();
 $('overlay').style.display='flex';
 let html='<h1>PANEL GURU</h1><p>Cipta atau buang akaun murid.</p>';
 html+='<input id="newId" placeholder="ID murid">';
 html+='<input id="newPw" placeholder="Kata laluan murid">';
 html+='<input id="newName" placeholder="Nama murid">';
 html+='<button class="mainbtn" id="addAccount">TAMBAH AKAUN</button><div id="accountList">';

 data.accounts.forEach(a=>{
  if(a.role!=='guru'){
   html+='<div class="account"><span>'+escapeHTML(a.id)+' – '+escapeHTML(a.name)+'</span><button class="smallbtn" data-del="'+escapeHTML(a.id)+'">BUANG</button></div>';
  }
 });

 html+='</div><button class="mainbtn" id="backGame">KEMBALI KE MISI</button>';
 $('box').innerHTML=html;

 $('addAccount').onclick=()=>{
  let id=$('newId').value.trim();
  let pw=$('newPw').value;
  let name=$('newName').value.trim();

  if(!id||!pw){toast('Isi ID dan kata laluan.');return}
  if(data.accounts.some(a=>a.id===id)){toast('ID sudah digunakan.');return}

  data.accounts.push({id,pw,role:'murid',name:name||id});
  saveData();showAdmin();toast('Akaun murid berjaya ditambah.');
 };

 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
  let id=b.dataset.del;
  data.accounts=data.accounts.filter(a=>a.id!==id);
  delete data.scores[id];
  delete data.progress[id];
  delete data.treasures[id];
  saveData();showAdmin();toast('Akaun dibuang.');
 });

 $('backGame').onclick=showMissionSelect;
}

/* PAPAR KOLEKSI */
function showTreasureCollection(){
 let t=getTreasures();
 let html='<h1>HARTA KARUN</h1><p>Jumlah koleksi: <b>'+treasureTotal()+'</b></p><div class="treasure-grid">';

 treasures.forEach((name,i)=>{
  html+='<div class="treasure-item">'+(i+1)+'. '+name+
  '<br><b>Dimiliki: '+(t[name]||0)+'</b></div>';
 });

 html+='</div><button class="mainbtn" id="closeTreasure">KEMBALI</button>';
 $('box').innerHTML=html;
 $('closeTreasure').onclick=showMissionSelect;
}

/* PILIH MISI */
function showMissionSelect(){
 playing=false;
 stopMusic();
 $('overlay').style.display='flex';
 let p=getProgress();
 let current=Math.max(0,Math.min(19,p.mission||0));

 let html='<h1>PILIH MISI</h1>';
 html+='<p>💎 Mata terkumpul: <b>'+getScore()+'</b></p>';
 html+='<p>Harta Karun: <b>'+treasureTotal()+'</b></p>';
 html+='<button class="smallbtn" id="openTreasure">KOLEKSI HARTA KARUN</button>';
 html+='<p>Misi yang selesai boleh dimainkan semula.</p><div class="mission-grid">';

 missions.forEach((m,i)=>{
  let unlocked=i<=current||!!p.done[i];
  let done=!!p.done[i];
  html+='<button class="mission-choice '+(done?'done':'')+'" data-mission="'+i+'" '+(!unlocked?'disabled':'')+'>';
  html+=(done?'✓ ':'')+(i+1)+'. '+escapeHTML(m[0])+'</button>';
 });

 html+='</div><button class="mainbtn" id="continueMission">SAMBUNG MISI SETERUSNYA</button>';
 $('box').innerHTML=html;

 document.querySelectorAll('[data-mission]').forEach(b=>{
  b.onclick=()=>{mission=Number(b.dataset.mission);startGame()};
 });
 $('continueMission').onclick=()=>{mission=current;startGame()};
 $('openTreasure').onclick=showTreasureCollection;
}

/* WATAK PEMAIN */
const player={
 x:100,y:0,vx:0,vy:0,w:38,h:66,
 dir:1,jumps:0,duck:false,inv:0,onGround:true
};

const ground=()=>H-90;
const worldW=8500;

function addCrate(x){
 world.push({
  type:'crate',x,y:ground()-48,w:48,h:48,
  broken:false,carried:false,thrown:false,vx:0,vy:0
 });
}

/* BILANGAN MUSUH IKUT PERINGKAT MISI
   MISI 1-4  : 5 MUSUH
   MISI 5-9  : 10 MUSUH
   MISI 10-14: 15 MUSUH
   MISI 15-19: 20 MUSUH
   MISI 20   : 25 MUSUH
*/
function enemyCount(){
 if(mission<4)return 5;
 if(mission<9)return 10;
 if(mission<14)return 15;
 if(mission<19)return 20;
 return 25;
}

function makeWorld(){
 world=[];enemies=[];shots=[];particles=[];
 collected=0;camera=0;walk=0;
 carriedBox=null;fireCooldown=0;

 player.x=100;
 player.y=ground()-player.h;
 player.vx=0;player.vy=0;
 player.jumps=0;player.duck=false;
 player.inv=0;player.onGround=true;

 for(let i=0;i<5;i++){
  world.push({
   type:'item',
   kind:missions[mission][2],
   x:650+i*1250+Math.random()*150,
   y:ground()-45,w:35,h:35,got:false
  });
  world.push({
   type:'npc',x:1000+i*1250,
   y:ground()-60,w:40,h:60,helped:false
  });
 }

 for(let i=0;i<25;i++)addCrate(380+i*315);

 for(let i=0;i<15;i++){
  world.push({
   type:'obstacle',x:520+i*540,
   y:ground()-48,w:65+Math.random()*28,
   h:48,broken:false
  });
 }

 /* MUSUH DIPERKENALKAN SECARA BERPERINGKAT */
 let types=['bird'];

 if(mission>=2)types.push('bat');
 if(mission>=5)types.push('turtle');
 if(mission>=7)types.push('fox');
 if(mission>=10)types.push('hedgehog');
 if(mission>=13)types.push('dragon');

 const total=enemyCount();

 for(let i=0;i<total;i++){
  let type=types[i%types.length];
  let x=550+i*(worldW-1000)/Math.max(1,total-1);
  x+=Math.random()*100;

  let flying=['bird','bat','dragon'].includes(type);

  enemies.push({
   type,
   x,
   y:flying?
    ground()-(type==='dragon'?210:150+Math.random()*100):
    ground()-(type==='turtle'?38:42),
   w:type==='dragon'?76:type==='turtle'?55:52,
   h:type==='dragon'?54:type==='turtle'?38:40,
   vx:(i%2?1:-1)*(1.4+Math.random()*1.2),
   phase:Math.random()*6,
   alive:true,
   hp:type==='dragon'?3:1,
   attack:Math.random()*100
  });
 }

 updateHUD();
}

function updateHUD(){
 if(!user)return;
 $('score').textContent='💎 MATA: '+getScore();
 $('missionText').textContent='MISI '+(mission+1)+': '+missions[mission][0];
 $('progress').textContent=collected+' / 5';
}

function startGame(){
 $('overlay').style.display='none';
 makeWorld();
 playing=true;

 say('Misi nombor '+(mission+1)+'. '+missions[mission][0]+'. '+missions[mission][1]);

 if(!muted){
  getAudio();
  startMusic();
 }
}

function say(t){
 if(!muted&&'speechSynthesis'in window){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t);
  u.lang='ms-MY';u.rate=.95;
  speechSynthesis.speak(u);
 }
}

function jump(){
 if(!playing||player.jumps>=2)return;
 player.vy=player.jumps===0?-12:-14;
 player.jumps++;
 player.onGround=false;
 sfx('jump');
}
function duck(v){if(playing)player.duck=v}

/* TEMBAKAN MENDATAR DAN KE ATAS */
function shoot(up=false){
 if(!playing||fireCooldown>0)return;

 shots.push({
  x:player.x+player.w/2,
  y:up?player.y+8:player.y+25,
  vx:up?0:player.dir*10,
  vy:up?-11:0,
  life:55
 });

 fireCooldown=9;
 sfx('shoot');
}
function fireUp(){shoot(true)}

/* ANGKAT PETI DAN LONTAR PETI
   KUASA LONTARAN DIPERTINGKATKAN
*/
function action(){
 if(!playing)return;

 if(carriedBox){
  let b=carriedBox;
  b.carried=false;
  b.thrown=true;

  /* LONTARAN LEBIH LAJU DAN KUAT */
  b.vx=player.dir*13;
  b.vy=-7.5;

  b.x=player.x+(player.dir>0?player.w:-b.w);
  b.y=player.y+18;

  carriedBox=null;
  toast('Peti dilontarkan dengan kuat!');
  sfx('smash');
  return;
 }

 let crate=world.find(o=>
  o.type==='crate'&&!o.broken&&!o.carried&&
  Math.abs(o.x-player.x)<75&&
  Math.abs(o.y-player.y)<90
 );

 if(crate){
  crate.carried=true;
  carriedBox=crate;
  toast('Peti diangkat! Tekan AKSI untuk melontar.');
  return;
 }

 let item=world.find(o=>
  o.type==='item'&&!o.got&&Math.abs(o.x-player.x)<90
 );

 if(item){
  item.got=true;
  collected++;
  setScore(getScore()+100);
  sfx('pickup');
  toast('Barang misi diperoleh! +100 mata');
  updateHUD();
  if(collected>=5)setTimeout(completeMission,500);
  return;
 }

 let npc=world.find(o=>
  o.type==='npc'&&!o.helped&&Math.abs(o.x-player.x)<90
 );

 if(npc){
  npc.helped=true;
  collected++;
  setScore(getScore()+100);
  toast('Penduduk dibantu! +100 mata');
  updateHUD();
  if(collected>=5)setTimeout(completeMission,500);
  return;
 }

 toast('Dekati peti, barang atau penduduk untuk berinteraksi.');
}

/* GANJARAN MISI */
function reward(){
 if(mission<5)return 5;
 if(mission<10)return 8;
 if(mission<15)return 10;
 return 15;
}

function completeMission(){
 if(!playing)return;

 playing=false;
 stopMusic();

 let p=getProgress();
 p.done[mission]=true;

 if(mission<19)p.mission=Math.max(p.mission||0,mission+1);
 else p.mission=19;

 setProgress(p);

 let bonus=reward();
 setScore(getScore()+bonus+500);
 sfx('win');

 showMessage(
  'MISI SELESAI!',
  missions[mission][1]+'<br><br>Ganjaran: 500 mata + '+bonus+' mata.',
  'PILIH MISI',
  ()=>showMissionSelect()
 );
}

function showMessage(title,desc,btn,fn){
 $('overlay').style.display='flex';
 $('box').innerHTML='<h1>'+title+'</h1><p>'+desc+'</p><button class="mainbtn" id="next">'+btn+'</button>';

 $('next').onclick=()=>{
  $('overlay').style.display='none';
  fn();
 };
}

/* SERANGAN MUSUH */
function damagePlayer(amount,message){
 if(player.inv>0)return;

 player.inv=90;
 setScore(getScore()-amount);
 player.vy=-5;
 player.vx=-player.dir*2;
 sfx('hurt');

 /* GETARAN TELEFON APABILA DILANGGAR */
 if(navigator.vibrate){
  try{navigator.vibrate([180,70,180])}catch(e){}
 }

 toast(message+' -'+amount+' mata');
}

function enemyDamage(e){
 /* BURUNG HITAM: PENALTI TETAP -3 MATA */
 if(e.type==='bird')return 3;

 if(e.type==='dragon')return 5;
 if(e.type==='hedgehog')return 5;

 return 3;
}

function enemyName(e){
 return {
  bird:'Burung hitam',
  bat:'Kelawar',
  dragon:'Naga',
  hedgehog:'Landak',
  turtle:'Kura-kura',
  fox:'Musang'
 }[e.type]||'Musuh';
}

function defeatEnemy(e){
 if(!e.alive)return;
 e.alive=false;
 sfx('stomp');
 toast(enemyName(e)+' ditewaskan!');
}

/* PETI PECAH DAN HARTA TERSEMBUNYI */
function breakCrate(b){
 if(b.broken)return;

 b.broken=true;
 b.carried=false;

 if(carriedBox===b)carriedBox=null;

 sfx('smash');

 let name=treasures[Math.floor(Math.random()*treasures.length)];
 addTreasure(name);

 for(let i=0;i<9;i++){
  particles.push({
   x:b.x+b.w/2,y:b.y+b.h/2,
   vx:(Math.random()-.5)*5,
   vy:-Math.random()*5-1,
   life:35,
   color:i%2?'#e9b84e':'#fff1a3'
  });
 }
}

/* KEMAS KINI PERMAINAN */
function update(dt){
 if(!playing)return;

 if(fireCooldown>0)fireCooldown-=dt;

 player.h=player.duck?38:66;
 player.vx=joystick*MOVE_SPEED;

 if(joystick)player.dir=joystick>0?1:-1;

 player.x=Math.max(
  0,
  Math.min(worldW-player.w,player.x+player.vx*dt)
 );

 player.vy+=.55*dt;
 player.y+=player.vy*dt;

 if(player.y>=ground()-player.h){
  player.y=ground()-player.h;
  player.vy=0;
  player.jumps=0;
  player.onGround=true;
 }else{
  player.onGround=false;
 }

 if(player.inv>0)player.inv-=dt;

 /* HALANGAN */
 for(let o of world){
  if(o.type==='obstacle'&&!o.broken&&
   player.x+player.w>o.x&&
   player.x<o.x+o.w&&
   player.y+player.h>o.y){

   if(player.y+player.h<o.y+20&&player.vy>=0){
    player.y=o.y-player.h;
    player.vy=0;
    player.jumps=0;
    player.onGround=true;
   }else{
    player.x-=player.dir*3;
   }
  }
 }

 /* PETI YANG DIANGKAT */
 if(carriedBox){
  carriedBox.x=player.x+player.dir*30;
  carriedBox.y=player.y-25;
 }

 /* PETI YANG DILONTAR */
 for(let b of world){
  if(b.type!=='crate'||b.broken||b.carried||!b.thrown)continue;

  b.x+=b.vx*dt;
  b.y+=b.vy*dt;
  b.vy+=.35*dt;

  if(b.y+b.h>=ground()){
   breakCrate(b);
   continue;
  }

  for(let e of enemies){
   if(e.alive&&
    Math.abs(b.x-e.x)<e.w&&
    Math.abs(b.y-e.y)<e.h){
    defeatEnemy(e);
    breakCrate(b);
    break;
   }
  }

  if(b.x<0||b.x>worldW)breakCrate(b);
 }

 /* PERGERAKAN DAN SERANGAN MUSUH */
 for(let e of enemies){
  if(!e.alive)continue;

  e.phase+=.13*dt;
  e.attack+=dt;

  if(e.type==='bird'||e.type==='bat'||e.type==='dragon'){
   e.x+=e.vx*dt;
   e.y+=Math.sin(e.phase*(e.type==='bat'?1.7:1))*1.5*dt;

   if(e.x<100||e.x>worldW-100)e.vx*=-1;
  }else{
   e.x+=e.vx*dt;

   if(e.x<100||e.x>worldW-100)e.vx*=-1;

   if(e.type==='fox'&&Math.abs(e.x-player.x)<260){
    e.x+=Math.sign(player.x-e.x)*2.2*dt;
   }

   if(e.type==='turtle')e.x+=Math.sin(e.phase)*.5*dt;
  }

  let overlap=
   player.x+player.w>e.x&&
   player.x<e.x+e.w&&
   player.y+player.h>e.y&&
   player.y<e.y+e.h;

  if(overlap){
   let fromAbove=
    player.vy>0&&
    player.y+player.h-e.y<22;

   if(fromAbove&&e.type!=='hedgehog'){
    defeatEnemy(e);
    player.y=e.y-player.h;
    player.vy=-8;
    player.jumps=1;
   }else{
    damagePlayer(enemyDamage(e),enemyName(e)+' melanggar watak!');
   }
  }
 }

 /* PELURU */
 for(let s of shots){
  s.x+=s.vx*dt;
  s.y+=s.vy*dt;
  s.life-=dt;

  for(let e of enemies){
   if(!e.alive)continue;

   if(Math.abs(s.x-(e.x+e.w/2))<e.w/2+7&&
      Math.abs(s.y-(e.y+e.h/2))<e.h/2+7){

    e.hp--;
    s.life=0;

    if(e.hp<=0)defeatEnemy(e);
    else toast('Musuh terkena! Serang lagi.');

    break;
   }
  }

  for(let b of world){
   if(b.type==='crate'&&!b.broken&&!b.carried&&
    Math.abs(s.x-(b.x+b.w/2))<b.w/2&&
    Math.abs(s.y-(b.y+b.h/2))<b.h/2){

    s.life=0;
    breakCrate(b);
    break;
   }
  }
 }

 shots=shots.filter(s=>s.life>0);

 for(let p of particles){
  p.x+=p.vx*dt;
  p.y+=p.vy*dt;
  p.vy+=.2*dt;
  p.life-=dt;
 }
 particles=particles.filter(p=>p.life>0);

 if(Math.abs(player.vx)>.1&&player.onGround&&!player.duck){
  walk+=dt*.24;
 }

 camera=Math.max(
  0,
  Math.min(worldW-W,player.x+player.w/2-W/2)
 );
}

/* LUKIS WATAK PEMAIN */
function drawHero(){
 let x=player.x-camera,y=player.y;

 if(player.inv>0&&Math.floor(player.inv/5)%2===0)return;

 const moving=Math.abs(player.vx)>.08&&player.onGround&&!player.duck;
 const swing=moving?Math.sin(walk)*9:0;
 const armSwing=moving?Math.sin(walk+Math.PI)*7:0;
 const airborne=!player.onGround;

 ctx.save();

 if(player.dir<0){
  ctx.translate(x+player.w,0);
  ctx.scale(-1,1);
 }else{
  ctx.translate(x,0);
 }

 const px=0;

 /* BAYANGAN */
 ctx.fillStyle='#173b5066';
 ctx.beginPath();
 ctx.ellipse(px+19,y+player.h,20,5,0,0,Math.PI*2);
 ctx.fill();

 if(player.duck){
  ctx.fillStyle='#1d6380';
  ctx.beginPath();
  ctx.roundRect(px+4,y+15,32,25,8);
  ctx.fill();

  ctx.fillStyle='#d9a17b';
  ctx.beginPath();
  ctx.arc(px+19,y+13,12,0,Math.PI*2);
  ctx.fill();
 }else{
  /* BADAN */
  ctx.fillStyle='#1d6380';
  ctx.beginPath();
  ctx.roundRect(px+5,y+24,28,34,7);
  ctx.fill();

  /* LENGAN */
  ctx.strokeStyle='#d9a17b';
  ctx.lineWidth=7;
  ctx.lineCap='round';
  ctx.beginPath();

  if(airborne){
   ctx.moveTo(px+6,y+31);
   ctx.lineTo(px-1,y+24);
   ctx.moveTo(px+32,y+31);
   ctx.lineTo(px+39,y+24);
  }else{
   ctx.moveTo(px+6,y+31);
   ctx.lineTo(px+3+armSwing,y+44);
   ctx.moveTo(px+32,y+31);
   ctx.lineTo(px+35-armSwing,y+44);
  }
  ctx.stroke();

  /* KAKI */
  ctx.strokeStyle='#d9a17b';
  ctx.lineWidth=8;
  ctx.beginPath();

  if(airborne){
   ctx.moveTo(px+12,y+53);
   ctx.lineTo(px+6,y+61);
   ctx.moveTo(px+26,y+53);
   ctx.lineTo(px+33,y+61);
  }else{
   ctx.moveTo(px+12,y+53);
   ctx.lineTo(px+12+swing,y+64);
   ctx.moveTo(px+26,y+53);
   ctx.lineTo(px+26-swing,y+64);
  }
  ctx.stroke();

  /* KASUT */
  ctx.fillStyle='#19364b';
  ctx.beginPath();
  ctx.roundRect(px+3+swing,y+61,15,7,4);
  ctx.roundRect(px+20-swing,y+61,15,7,4);
  ctx.fill();

  /* WAJAH */
  ctx.fillStyle='#d9a17b';
  ctx.beginPath();
  ctx.arc(px+19,y+15,15,0,Math.PI*2);
  ctx.fill();

  /* KOPIAH */
  ctx.fillStyle='#f4f0e6';
  ctx.beginPath();
  ctx.ellipse(px+19,y+3,19,7,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle='#183c50';
  ctx.fillRect(px+7,y-1,24,8);

  /* MATA */
  ctx.fillStyle='#202b32';
  ctx.fillRect(px+13,y+13,3,3);
  ctx.fillRect(px+23,y+13,3,3);
 }

 ctx.restore();
}

/* LATAR PERMAINAN */
function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#53c9e8');
 g.addColorStop(1,'#d9fff0');
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);

 ctx.fillStyle='#fff4bd';
 ctx.beginPath();
 ctx.arc(W*.82,H*.18,35,0,Math.PI*2);
 ctx.fill();

 /* BUKIT */
 ctx.fillStyle='#70bd72';
 ctx.beginPath();
 ctx.moveTo(0,ground());

 for(let x=0;x<=W;x+=12){
  ctx.lineTo(
   x,
   ground()-100-Math.sin((x+camera*.15)/100)*40
  );
 }

 ctx.lineTo(W,ground());
 ctx.fill();

 /* TANAH */
 ctx.fillStyle='#287c4b';
 ctx.fillRect(0,ground(),W,H-ground());

 ctx.fillStyle='#1c603b';
 ctx.fillRect(0,ground()+9,W,7);

 ctx.fillStyle='#fff';
 ctx.font='bold 15px Arial';
 ctx.textAlign='center';
 ctx.fillText(locations[mission],W/2,H*.22);
}

/* PAPARAN OBJEK */
function render(){
 drawBackground();

 for(let o of world){
  let x=o.x-camera;
  if(x<-120||x>W+120)continue;

  if(o.type==='obstacle'&&!o.broken){
   ctx.fillStyle='#956037';
   ctx.beginPath();
   ctx.roundRect(x,o.y,o.w,o.h,9);
   ctx.fill();

   ctx.strokeStyle='#d1a36c';
   ctx.lineWidth=3;
   ctx.stroke();

   ctx.strokeStyle='#704425';
   ctx.lineWidth=2;
   ctx.beginPath();
   ctx.moveTo(x+8,o.y+8);
   ctx.lineTo(x+o.w-8,o.y+o.h-8);
   ctx.stroke();
  }

  if(o.type==='crate'&&!o.broken){
   ctx.fillStyle='#a66b35';
   ctx.fillRect(x,o.y,o.w,o.h);

   ctx.strokeStyle='#f0c17c';
   ctx.lineWidth=3;
   ctx.strokeRect(x+2,o.y+2,o.w-4,o.h-4);

   ctx.strokeStyle='#75451f';
   ctx.lineWidth=4;
   ctx.beginPath();
   ctx.moveTo(x+5,o.y+5);
   ctx.lineTo(x+o.w-5,o.y+o.h-5);
   ctx.moveTo(x+o.w-5,o.y+5);
   ctx.lineTo(x+5,o.y+o.h-5);
   ctx.stroke();

   if(o.carried){
    ctx.fillStyle='#fff';
    ctx.font='bold 10px Arial';
    ctx.textAlign='center';
    ctx.fillText('PETI',x+o.w/2,o.y-5);
   }
  }

  if(o.type==='item'&&!o.got){
   drawMissionItem(o,x);
  }

  if(o.type==='npc'&&!o.helped){
   ctx.fillStyle='#1d6380';
   ctx.beginPath();
   ctx.roundRect(x+7,o.y+17,27,37,7);
   ctx.fill();

   ctx.fillStyle='#d9a17b';
   ctx.beginPath();
   ctx.arc(x+20,o.y+10,12,0,Math.PI*2);
   ctx.fill();

   ctx.fillStyle='#fff';
   ctx.fillText('!',x+20,o.y-5);
  }
 }

 for(let e of enemies){
  if(e.alive)drawEnemy(e);
 }

 for(let s of shots){
  ctx.fillStyle='#ffe56b';
  ctx.shadowColor='#fff5a8';
  ctx.shadowBlur=10;

  ctx.beginPath();
  ctx.arc(s.x-camera,s.y,5,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;
 }

 for(let p of particles){
  ctx.globalAlpha=Math.max(0,p.life/35);
  ctx.fillStyle=p.color;
  ctx.fillRect(p.x-camera,p.y,6,6);
 }

 ctx.globalAlpha=1;
 drawHero();
}

/* GELUNG PERMAINAN */
function loop(t){
 let dt=Math.min(2,(t-last)/16.67||1);
 last=t;
 update(dt);
 render();
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* KAWALAN TELEFON */
const stick=$('stick'),knob=$('knob');

function moveStick(e){
 let r=stick.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;
 let len=Math.hypot(dx,dy),max=34;

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 knob.style.transform=`translate(${dx}px,${dy}px)`;
 joystick=Math.abs(dx)<6?0:dx/max;
}

stick.onpointerdown=e=>{
 stick.setPointerCapture(e.pointerId);
 moveStick(e);
};
stick.onpointermove=e=>{
 if(e.buttons)moveStick(e);
};

function resetStick(){
 joystick=0;
 knob.style.transform='translate(0,0)';
}
stick.onpointerup=resetStick;
stick.onpointercancel=resetStick;

function hold(id,down,up){
 let b=$(id);

 b.onpointerdown=e=>{
  e.preventDefault();
  b.setPointerCapture(e.pointerId);
  down();
 };

 b.onpointerup=e=>{
  e.preventDefault();
  up();
 };

 b.onpointercancel=up;
 b.onlostpointercapture=up;
}

hold('jump',jump,()=>{});
hold('duck',()=>duck(true),()=>duck(false));
hold('fire',()=>shoot(false),()=>{});
hold('fireUp',()=>shoot(true),()=>{});

$('act').onpointerdown=e=>{
 e.preventDefault();
 action();
};

/* PAPAN KEKUNCI */
addEventListener('keydown',e=>{
 if(e.repeat)return;

 if(e.key==='ArrowRight'||e.key==='d')joystick=1;
 if(e.key==='ArrowLeft'||e.key==='a')joystick=-1;

 if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();
 if(e.key==='s'||e.key==='ArrowDown')duck(true);

 if(e.key==='j')shoot(false);
 if(e.key==='i')shoot(true);
 if(e.key==='k'||e.key==='Enter')action();
});

addEventListener('keyup',e=>{
 if(['ArrowRight','d','ArrowLeft','a'].includes(e.key))joystick=0;
 if(e.key==='s'||e.key==='ArrowDown')duck(false);
});

/* SAMBUNG KEMAJUAN */
mission=Math.max(0,Math.min(19,getProgress().mission||0));

})();
</script>
