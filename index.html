<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#102b35">
<title>JATIDIRI TERPUJI</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#102b35;font-family:Arial,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}
.panel{background:#102b35dd;color:white;border:1px solid #ffffff55;border-radius:12px;padding:8px;font-size:12px;font-weight:bold}
#missionText{max-width:58%;text-align:center}
#buttons{position:absolute;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#stick{width:112px;height:112px;border-radius:50%;background:#153d4b55;border:3px solid #ffffff66;position:relative;pointer-events:auto;touch-action:none;backdrop-filter:blur(2px)}
#knob{position:absolute;width:48px;height:48px;left:29px;top:29px;border-radius:50%;background:#ffffffbb;border:3px solid #287f91}
#actionButtons{display:grid;grid-template-columns:repeat(2,68px);gap:8px;pointer-events:auto}
.ctrl{height:54px;border:2px solid #ffffff66;border-radius:15px;background:#123e5077;color:white;font-weight:bold;font-size:11px;touch-action:none;backdrop-filter:blur(3px)}
#sound,#admin{position:absolute;right:9px;bottom:137px;border:1px solid #ffffff55;border-radius:20px;padding:8px 12px;background:#123e5077;color:white;font-weight:bold}
#admin{bottom:180px}
#overlay{position:absolute;inset:0;background:#071b24e8;display:flex;align-items:center;justify-content:center;padding:12px}
#box{width:min(520px,95vw);max-height:92%;overflow:auto;background:linear-gradient(145deg,#fff,#d9f5ef);border:3px solid #e7bd55;border-radius:22px;padding:18px;text-align:center;color:#12343c}
h1{font-size:clamp(22px,5vw,34px);margin:5px 0;color:#14566a}
input{width:90%;padding:12px;margin:5px;border:1px solid #91b9b5;border-radius:10px;font-size:16px}
.mainbtn{background:#087e72;color:white;border:0;border-radius:14px;padding:12px 22px;font-weight:bold;font-size:15px;margin:5px}
.smallbtn{background:#e9b84e;color:#263b40;border:0;border-radius:10px;padding:9px 13px;font-weight:bold;margin:4px}
#toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#102b35ef;color:white;border-radius:14px;padding:9px 15px;font-weight:bold;font-size:13px;display:none;max-width:85%;text-align:center}
.account{display:flex;justify-content:space-between;align-items:center;padding:7px;background:#e8f4ed;margin:5px;border-radius:8px}
@media(orientation:portrait){#box:after{content:"Pusingkan telefon ke mod melintang untuk pengalaman terbaik.";display:block;color:#a04424;font-weight:bold;margin-top:10px}}
</style>
</head>

<body>
<div id="game">
<canvas id="c"></canvas>

<div id="top">
 <div class="panel" id="score">💎 0 Eko</div>
 <div class="panel" id="missionText">JATIDIRI TERPUJI</div>
 <div class="panel" id="progress">0 / 5</div>
</div>

<div id="toast"></div>
<button id="sound">♫ BUNYI ON</button>
<button id="admin" style="display:none">PANEL GURU</button>

<div id="buttons">
 <div id="stick"><div id="knob"></div></div>
 <div id="actionButtons">
  <button class="ctrl" id="fire">KUASA<br>TEMBAK</button>
  <button class="ctrl" id="jump">LOMPAT</button>
  <button class="ctrl" id="duck">TUNDUK</button>
  <button class="ctrl" id="act">AKSI</button>
 </div>
</div>

<div id="overlay">
 <div id="box">
  <h1>JATIDIRI TERPUJI</h1>
  <b>KP2027 – Pengembaraan 20 Misi Karakter</b>
  <p>Login untuk memulakan pengembaraan.</p>
  <input id="loginId" placeholder="ID pengguna">
  <input id="loginPw" type="password" placeholder="Kata laluan">
  <button class="mainbtn" id="login">LOGIN</button>
  <p style="font-size:11px">Login guru pertama: guru / guru123</p>
 </div>
</div>
</div>

<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const canvas=$('c'),ctx=canvas.getContext('2d');
let W,H,playing=false,muted=false,joystick=0,camera=0;
let user=null,world=[],birds=[],shots=[],particles=[];
let mission=0,collected=0,eko=0,last=0,walk=0;
let audio=null;

function resize(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 W=innerWidth;H=innerHeight;
}
addEventListener('resize',resize);resize();

const missions=[
 ['Kutip Botol Plastik','Cari botol plastik dan masukkan ke tong kitar semula.','botol'],
 ['Kitar Semula Tin','Cari tin aluminium dan masukkan ke tong.','tin'],
 ['Selamatkan Arnab','Pecahkan peti dan selamatkan anak arnab.','arnab'],
 ['Berkongsi Rezeki','Kumpulkan makanan dan bantu penduduk.','makanan'],
 ['Hadiah Buat Sahabat','Cari hadiah untuk orang yang bersedih.','hadiah'],
 ['Beri Makan Kucing','Cari makanan dan berikan kepada kucing.','ikan'],
 ['Tabung Masjid','Kutip wang syiling dan masukkan ke tabung.','syiling'],
 ['Pesanan Kebaikan','Cari belon pesanan dan serahkan kepada penduduk.','belon'],
 ['Misi Buah Mangga','Cari mangga masak dan berikan kepada penduduk.','mangga'],
 ['Buka Laluan','Alihkan halangan kayu yang menghalang jalan.','kayu'],
 ['Mendamaikan Sahabat','Cari bunga dan bantu sahabat berbaik semula.','bunga'],
 ['Bantu Warga Emas','Cari barang dan bantu warga emas.','bakul'],
 ['Cari Orang Sesat','Temui penduduk yang sesat dan bimbing mereka.','petunjuk'],
 ['Misi Banjir','Kumpulkan pelampung dan bantu penduduk.','pelampung'],
 ['Selamatkan Anak Burung','Cari anak burung dan bawa ke sarang.','burung'],
 ['Pembantu Kebakaran','Ambil baldi dan bantu memadamkan api kecil.','baldi'],
 ['Bina Jambatan','Kumpulkan papan untuk membina jambatan.','papan'],
 ['Pulangkan Barang','Cari beg yang hilang dan pulangkan.','beg'],
 ['Bantuan Pergunungan','Kumpulkan makanan dan selimut.','selimut'],
 ['Cabaran Kemuncak','Selesaikan cabaran dan bantu penduduk.','bekalan']
];

const locations=[
'KAMPUNG HIJAU','PANTAI BIRU','HUTAN BULUH','LEMBAH MANGGA',
'TAMAN BUNGA','SUNGAI JERNIH','KAWASAN MASJID','TAMAN IMPIAN',
'KEBUN BUAH','LALUAN KAYU','TAMAN SAHABAT','KAMPUNG DAMAI',
'HUTAN RIMBA','KAWASAN BANJIR','HUTAN BURUNG','KAMPUNG API',
'JAMBATAN SUNGAI','PEKAN LAMA','KAWASAN GUNUNG','DUNIA JATIDIRI'
];

const saveKey='JT2027_DATA';
let data=JSON.parse(localStorage.getItem(saveKey)||'null');

if(!data){
 data={
  accounts:[{id:'guru',pw:'guru123',role:'guru',name:'Guru'}],
  scores:{},progress:{}
 };
 localStorage.setItem(saveKey,JSON.stringify(data));
}

function saveData(){localStorage.setItem(saveKey,JSON.stringify(data))}
function key(){return user.id}
function getScore(){return data.scores[key()]||0}
function setScore(v){data.scores[key()]=Math.max(0,v);saveData();updateHUD()}
function getProgress(){return data.progress[key()]||{mission:0,done:{}}}
function setProgress(p){data.progress[key()]=p;saveData()}

function toast(t){
 $('toast').textContent=t;
 $('toast').style.display='block';
 setTimeout(()=>$('toast').style.display='none',2200);
}

function tone(freq=440,dur=.1,type='sine',vol=.08){
 if(muted)return;
 try{
  if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==='suspended')audio.resume();
  let o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);
  o.connect(g);g.connect(audio.destination);
  o.start();o.stop(audio.currentTime+dur);
 }catch(e){}
}
function sfx(n){
 const sounds={
  jump:()=>tone(400,.12,'triangle'),
  shoot:()=>tone(170,.08,'sawtooth'),
  pickup:()=>{tone(650,.1);setTimeout(()=>tone(850,.1),70)},
  hurt:()=>tone(100,.25,'sawtooth'),
  win:()=>[523,659,784,1046].forEach((n,i)=>setTimeout(()=>tone(n,.25),i*130))
 };
 if(sounds[n])sounds[n]();
}

$('sound').onclick=()=>{
 muted=!muted;
 $('sound').textContent=muted?'♫ BUNYI OFF':'♫ BUNYI ON';
};

$('login').onclick=()=>{
 let id=$('loginId').value.trim();
 let pw=$('loginPw').value;
 let account=data.accounts.find(a=>a.id===id&&a.pw===pw);
 if(!account){toast('ID atau kata laluan salah!');return}
 user=account;
 $('overlay').style.display='none';
 $('admin').style.display=user.role==='guru'?'block':'none';
 mission=getProgress().mission||0;
 startGame();
};

$('admin').onclick=showAdmin;

function showAdmin(){
 playing=false;
 $('overlay').style.display='flex';
 let html='<h1>PANEL GURU</h1><p>Cipta atau buang akaun murid.</p>';
 html+='<input id="newId" placeholder="ID murid">';
 html+='<input id="newPw" placeholder="Kata laluan murid">';
 html+='<input id="newName" placeholder="Nama murid">';
 html+='<button class="mainbtn" id="addAccount">TAMBAH AKAUN</button>';
 html+='<div id="accountList">';
 data.accounts.forEach(a=>{
  if(a.role!=='guru'){
   html+='<div class="account"><span>'+a.id+' – '+a.name+'</span><button class="smallbtn" data-del="'+a.id+'">BUANG</button></div>';
  }
 });
 html+='</div><button class="mainbtn" id="backGame">KEMBALI KE GAME</button>';
 $('box').innerHTML=html;

 $('addAccount').onclick=()=>{
  let id=$('newId').value.trim(),pw=$('newPw').value,name=$('newName').value.trim();
  if(!id||!pw){toast('Isi ID dan kata laluan.');return}
  if(data.accounts.some(a=>a.id===id)){toast('ID sudah digunakan.');return}
  data.accounts.push({id,pw,role:'murid',name:name||id});
  saveData();showAdmin();toast('Akaun murid berjaya ditambah.');
 };

 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
  let id=b.dataset.del;
  data.accounts=data.accounts.filter(a=>a.id!==id);
  delete data.scores[id];delete data.progress[id];
  saveData();showAdmin();toast('Akaun dibuang.');
 });

 $('backGame').onclick=()=>{
  $('overlay').style.display='none';
  playing=true;
 };
}

/* Watak dan dunia */
const player={x:100,y:0,vx:0,vy:0,w:38,h:66,dir:1,jumps:0,duck:false,inv:0};
const ground=()=>H-90;
const worldW=6500;

function makeWorld(){
 world=[];birds=[];shots=[];particles=[];collected=0;camera=0;
 player.x=100;player.y=ground()-player.h;player.vx=player.vy=0;player.jumps=0;
 for(let i=0;i<5;i++){
  world.push({type:'item',x:650+i*1050+Math.random()*150,y:ground()-45,w:35,h:35,got:false});
  world.push({type:'npc',x:1000+i*1050,y:ground()-60,w:40,h:60,helped:false});
 }
 for(let i=0;i<14;i++){
  world.push({type:'obstacle',x:400+i*420,y:ground()-45,w:65,h:45});
 }
 for(let i=0;i<7;i++){
  birds.push({
   x:500+i*850,y:ground()-150-Math.random()*140,
   w:58,h:38,vx:2.1+Math.random()*1.8,
   phase:Math.random()*6,alive:true
  });
 }
 updateHUD();
}

function updateHUD(){
 $('score').textContent='💎 '+getScore()+' Eko';
 $('missionText').textContent='MISI '+(mission+1)+': '+missions[mission][0];
 $('progress').textContent=collected+' / 5';
}

function startGame(){
 makeWorld();playing=true;
 say('Selamat datang ke Jatidiri Terpuji. '+missions[mission][0]);
}
function say(t){
 if(!muted&&'speechSynthesis'in window){
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(t);u.lang='ms-MY';u.rate=.95;
  speechSynthesis.speak(u);
 }
}

function jump(){
 if(!playing||player.jumps>=2)return;
 player.vy=player.jumps===0?-12:-14;
 player.jumps++;sfx('jump');
}
function duck(v){if(playing)player.duck=v}
function shoot(){
 if(!playing)return;
 shots.push({x:player.x+player.w/2,y:player.y+25,vx:player.dir*10,life:50});
 sfx('shoot');
}
function action(){
 if(!playing)return;
 let item=world.find(o=>o.type==='item'&&!o.got&&Math.abs(o.x-player.x)<90);
 if(item){
  item.got=true;collected++;setScore(getScore()+100);sfx('pickup');
  toast('Barang misi diperoleh! +100 Eko');
  updateHUD();
  if(collected>=5)setTimeout(completeMission,500);
  return;
 }
 let npc=world.find(o=>o.type==='npc'&&!o.helped&&Math.abs(o.x-player.x)<90);
 if(npc){
  npc.helped=true;collected++;setScore(getScore()+100);
  toast('Penduduk dibantu! +100 Eko');updateHUD();
  if(collected>=5)setTimeout(completeMission,500);
  return;
 }
 toast('Teruskan mencari barang dan penduduk.');
}

function reward(){
 if(mission<5)return 5;
 if(mission<10)return 8;
 if(mission<15)return 10;
 return 15;
}

function completeMission(){
 if(!playing)return;
 playing=false;
 let p=getProgress();
 let wasDone=!!p.done[mission];
 p.done[mission]=true;
 setProgress(p);
 setScore(getScore()+reward()+500);
 sfx('win');
 showMessage('MISI SELESAI!',
  missions[mission][1]+'<br><br>Ganjaran: 500 Eko + '+reward()+' Eko.',
  'TERUSKAN',()=>{
   if(mission<19)mission++;
   else mission=0;
   p=getProgress();p.mission=mission;setProgress(p);
   startGame();
  });
}

function showMessage(title,desc,btn,fn){
 $('overlay').style.display='flex';
 $('box').innerHTML='<h1>'+title+'</h1><p>'+desc+'</p><button class="mainbtn" id="next">'+btn+'</button>';
 $('next').onclick=()=>{$('overlay').style.display='none';fn()};
}

/* Serangan burung */
function birdHit(b){
 if(player.inv>0)return;
 player.inv=90;
 setScore(getScore()-3);
 player.vy=-5;
 player.vx=-player.dir*2;
 sfx('hurt');
 toast('Dilanggar burung hitam! -3 Eko');
}

function update(dt){
 if(!playing)return;
 player.vx=joystick*4;
 if(joystick)player.dir=joystick>0?1:-1;
 player.x=Math.max(0,Math.min(worldW-player.w,player.x+player.vx*dt));
 player.vy+=.55*dt;
 player.y+=player.vy*dt;
 player.h=player.duck?38:66;
 if(player.y>=ground()-player.h){
  player.y=ground()-player.h;player.vy=0;player.jumps=0;
 }

 if(player.inv>0)player.inv-=dt;

 for(let o of world){
  if(o.type==='obstacle'&&
   player.x+player.w>o.x&&player.x<o.x+o.w&&
   player.y+player.h>o.y){
   if(player.y+player.h<o.y+20&&player.vy>=0){
    player.y=o.y-player.h;player.vy=0;player.jumps=0;
   }else player.x-=player.dir*3;
  }
 }

 for(let b of birds){
  if(!b.alive)continue;
  b.x+=b.vx*dt;
  b.phase+=.15*dt;
  b.y+=Math.sin(b.phase)*1.3;
  if(b.x>worldW+100)b.x=-100;
  if(Math.abs(player.x-b.x)<player.w+20&&
   Math.abs(player.y-b.y)<player.h+10)birdHit(b);
 }

 for(let s of shots){
  s.x+=s.vx*dt;s.life-=dt;
  for(let b of birds){
   if(b.alive&&Math.abs(s.x-b.x)<b.w&&Math.abs(s.y-b.y)<b.h){
    b.alive=false;s.life=0;
    toast('Burung hitam ditewaskan!');
   }
  }
 }
 shots=shots.filter(s=>s.life>0);
 camera=Math.max(0,Math.min(worldW-W,player.x-W*.65));
}

/* Grafik tajam, watak beranimasi */
function drawHero(){
 let x=player.x-camera,y=player.y;
 if(player.inv>0&&Math.floor(player.inv/5)%2===0)return;
 ctx.save();
 if(player.dir<0){ctx.translate(x+player.w,0);ctx.scale(-1,1);x=0}
 else x=x;
 if(player.dir<0)x=0;
 let px=player.dir<0?0:player.x-camera;
 if(player.dir<0)px=0;
 ctx.shadowColor='#102b35';ctx.shadowBlur=7;
 ctx.fillStyle='#173b50';
 ctx.beginPath();ctx.ellipse(player.dir<0?player.w/2:px+player.w/2,y+player.h,20,5,0,0,7);ctx.fill();
 ctx.shadowBlur=0;

 let xx=player.dir<0?0:px;
 if(player.duck){
  ctx.fillStyle='#1d6380';ctx.beginPath();ctx.roundRect(xx+4,y+15,32,25,8);ctx.fill();
 }else{
  ctx.fillStyle='#1d6380';ctx.beginPath();ctx.roundRect(xx+5,y+24,28,34,7);ctx.fill();
  ctx.fillStyle='#d9a17b';ctx.fillRect(xx+8,y+45,8,18);ctx.fillRect(xx+23,y+45,8,18);
  ctx.fillStyle='#19364b';ctx.fillRect(xx+7,y+59,11,7);ctx.fillRect(xx+23,y+59,11,7);
  ctx.fillStyle='#d9a17b';ctx.beginPath();ctx.arc(xx+19,y+15,15,0,7);ctx.fill();
  ctx.fillStyle='#f4f0e6';ctx.beginPath();ctx.ellipse(xx+19,y+3,19,7,0,0,7);ctx.fill();
  ctx.fillStyle='#183c50';ctx.fillRect(xx+7,y-1,24,8);
  ctx.fillStyle='#202b32';ctx.fillRect(xx+13,y+13,3,3);ctx.fillRect(xx+23,y+13,3,3);
  ctx.fillStyle='#d9a17b';ctx.fillRect(xx,y+28,7,18);ctx.fillRect(xx+31,y+28,7,18);
 }
 ctx.restore();
}

function drawBird(b){
 let x=b.x-camera,y=b.y;
 ctx.save();
 ctx.translate(x+b.w/2,y+b.h/2);
 ctx.rotate(Math.sin(b.phase)*.12);
 ctx.fillStyle='#101922';
 ctx.beginPath();ctx.ellipse(0,0,24,13,0,0,7);ctx.fill();
 ctx.fillStyle='#253846';
 ctx.beginPath();ctx.ellipse(-4,-9,18,10,Math.sin(b.phase)*.4,0,7);ctx.fill();
 ctx.fillStyle='#0b1117';
 ctx.beginPath();ctx.moveTo(-10,0);ctx.lineTo(-34,-14);ctx.lineTo(-24,8);ctx.lineTo(-9,10);ctx.fill();
 ctx.fillStyle='#e4b848';
 ctx.beginPath();ctx.moveTo(19,-2);ctx.lineTo(34,3);ctx.lineTo(19,7);ctx.fill();
 ctx.fillStyle='#fff';
 ctx.beginPath();ctx.arc(12,-5,4,0,7);ctx.fill();
 ctx.fillStyle='#111';
 ctx.beginPath();ctx.arc(13,-5,2,0,7);ctx.fill();
 ctx.restore();
}

function drawBackground(){
 let g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#53c9e8');g.addColorStop(1,'#d9fff0');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#fff4bd';ctx.beginPath();ctx.arc(W*.82,H*.18,35,0,7);ctx.fill();
 ctx.fillStyle='#70bd72';
 ctx.beginPath();ctx.moveTo(0,ground());
 for(let x=0;x<=W;x+=12)ctx.lineTo(x,ground()-100-Math.sin((x+camera*.15)/100)*40);
 ctx.lineTo(W,ground());ctx.fill();
 ctx.fillStyle='#287c4b';ctx.fillRect(0,ground(),W,H-ground());
 ctx.fillStyle='#1c603b';ctx.fillRect(0,ground()+9,W,7);
 ctx.fillStyle='#fff';ctx.font='bold 15px Arial';ctx.textAlign='center';
 ctx.fillText(locations[mission],W/2,H*.22);
}

function render(){
 drawBackground();

 for(let o of world){
  let x=o.x-camera;if(x<-100||x>W+100)continue;
  if(o.type==='obstacle'){
   ctx.fillStyle='#956037';ctx.beginPath();ctx.roundRect(x,o.y,o.w,o.h,9);ctx.fill();
   ctx.strokeStyle='#d1a36c';ctx.lineWidth=3;ctx.stroke();
  }
  if(o.type==='item'&&!o.got){
   ctx.shadowColor='#ffe66b';ctx.shadowBlur=12;
   ctx.fillStyle='#e9b84e';ctx.beginPath();ctx.arc(x+17,o.y+17,16,0,7);ctx.fill();
   ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.font='bold 17px Arial';
   ctx.textAlign='center';ctx.fillText('★',x+17,o.y+23);
  }
  if(o.type==='npc'&&!o.helped){
   ctx.fillStyle='#1d6380';ctx.beginPath();ctx.roundRect(x+7,o.y+17,27,37,7);ctx.fill();
   ctx.fillStyle='#d9a17b';ctx.beginPath();ctx.arc(x+20,o.y+10,12,0,7);ctx.fill();
   ctx.fillStyle='#fff';ctx.fillText('!',x+20,o.y-5);
  }
 }
 for(let b of birds)if(b.alive)drawBird(b);
 for(let s of shots){
  ctx.fillStyle='#ffe56b';ctx.shadowColor='#fff5a8';ctx.shadowBlur=10;
  ctx.beginPath();ctx.arc(s.x-camera,s.y,5,0,7);ctx.fill();ctx.shadowBlur=0;
 }
 drawHero();
}

function loop(t){
 let dt=Math.min(2,(t-last)/16.67||1);last=t;
 update(dt);render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* Kawalan telefon */
const stick=$('stick'),knob=$('knob');
function moveStick(e){
 let r=stick.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;
 let len=Math.hypot(dx,dy),max=34;
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 joystick=Math.abs(dx)<6?0:dx/max;
}
stick.onpointerdown=e=>{stick.setPointerCapture(e.pointerId);moveStick(e)};
stick.onpointermove=e=>{if(e.buttons)moveStick(e)};
function resetStick(){joystick=0;knob.style.transform='translate(0,0)'}
stick.onpointerup=resetStick;stick.onpointercancel=resetStick;

function hold(id,down,up){
 let b=$(id);
 b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);down()};
 b.onpointerup=e=>{e.preventDefault();up()};
 b.onpointercancel=up;b.onlostpointercapture=up;
}
hold('jump',jump,()=>{});
hold('duck',()=>duck(true),()=>duck(false));
hold('fire',shoot,()=>{});
$('act').onpointerdown=e=>{e.preventDefault();action()};

addEventListener('keydown',e=>{
 if(e.repeat)return;
 if(e.key==='ArrowRight'||e.key==='d')joystick=1;
 if(e.key==='ArrowLeft'||e.key==='a')joystick=-1;
 if(e.key===' '||e.key==='ArrowUp'||e.key==='w')jump();
 if(e.key==='s'||e.key==='ArrowDown')duck(true);
 if(e.key==='j')shoot();
 if(e.key==='k'||e.key==='Enter')action();
});
addEventListener('keyup',e=>{
 if(['ArrowRight','d','ArrowLeft','a'].includes(e.key))joystick=0;
 if(e.key==='s'||e.key==='ArrowDown')duck(false);
});

/* Sambung misi dan simpanan */
mission=Math.max(0,Math.min(19,getProgress().mission||0));
})();
</script>
</body>
</html>
